// что может утащить кобольд: [поле героя, название в винительном падеже]
// кобольд-вор с добычей удирает: в начале каждого хода обворованного героя делает 1 шаг прочь от него.
// Не догнали за KOBOLD_TURNS ходов — скрылся навсегда; добежал до края подземелья — сбежал раньше.
const KOBOLD_TURNS=4;
function koboldTick(p){
  const idx=S.players.indexOf(p);let moved=false;
  const list=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const st=cell(r,c).stash;if(st&&st.kind==='kobold'&&st.owner===idx)list.push([r,c,st]);}
  for(const [r,c,st] of list){
    const gone=t=>{cell(r,c).stash=null;boardFull=true;moved=true;addLog(t);toast(t,3200);};
    if(!alive(p)){gone('Кобольд-вор скрылся в темноте с добычей.');continue;}
    st.left=(st.left??KOBOLD_TURNS)-1;
    if(st.left<=0){gone(`Кобольд-вор скрылся навсегда — ${st.text} не вернуть.`);if(st.quest)S.kLost=true;continue;}
    // в миссии кобольд устал: удирает через ход и только когда герой подобрался близко
    if(st.slow&&(st.left%2||Math.abs(r-p.r)+Math.abs(c-p.c)>3)){boardFull=true;moved=true;continue;}
    const far=([a,b])=>Math.abs(a-p.r)+Math.abs(b-p.c);
    const opts=['U','R','D','L'].map(d=>[r+D[d][0],c+D[d][1]]).filter(([a,b])=>walkable(a,b)&&!cell(a,b).stash&&!S.players.some(q=>alive(q)&&q.r===a&&q.c===b)&&!(st.quest&&edgeDist(a,b)<2));
    if(!opts.length){boardFull=true;continue;}
    const best=Math.max(...opts.map(far)),top=opts.filter(o=>far(o)===best),[a,b]=top[rnd(top.length)];
    cell(r,c).stash=null;
    if(onEdge(a,b)){gone(`Кобольд-вор добежал до края подземелья и сбежал — ${st.text} не вернуть.`);if(st.quest)S.kLost=true;continue;}
    cell(a,b).stash=st;boardFull=true;moved=true;
  }
  if(moved)render();
}
const STEALABLE=[['potions','зелье здоровья'],['bombs','сонную бомбу'],['sword','старый меч'],['silver','серебряный клинок'],['shield','щит'],['pick','кирку'],['rope','верёвку'],['luck','амулет удачи'],['hasteP','зелье скорости'],['key','медный ключ']];
function koboldSteal(p){
  const have=STEALABLE.filter(([k])=>typeof p[k]==='number'?p[k]>0:!!p[k]);
  if(!have.length){const g=Math.ceil(p.gold*0.2);p.gold-=g;return{gold:g,text:g?`${g} ${plural(g,'золотой','золотых','золотых')}`:'пустой мешок'};}
  const [k,n]=have[rnd(have.length)];let v;
  if(typeof p[k]==='number'){if(k==='luck'||k==='haste'){v=p[k];p[k]=0;}else{v=1;p[k]--;}}else{v=true;p[k]=false;}

}

/* ---------- мешок погибшего героя ----------
   Погибший в подземелье оставляет мешок на клетке. Вошедший на неё: 50% — мешок цел (крысы погрызли: 50–100% золота),

async function stashAt(p){

      text:`${st.zombie?`Зомби ${st.name} всё ещё сторожит свой мешок.`:`Ты тянешься к мешку — и мёртвые пальцы хватают тебя за руку. Проклятие дракона подняло павшего: перед тобой зомби ${st.name}!`}\n\nПобеда — весь мешок твой: ${st.gold} золотых. Поражение — −1 ♥, а зомби останется на клетке.${p.shield?' Щит примет удар.':''}`,
      roll:rollOpts(p,14,wb.b+lb+cb,bonusT(wb.t,lb?'амулет':'',cb?penLabel(p):''),(r,win)=>{
        let t;

        else{st.zombie=true;boardFull=true;t=shieldSave(p)?'Зомби обрушил удар на щит — щит раскололся, но ты цел. Зомби остался сторожить мешок.':`Зомби отбросил тебя: ${harm(p,{dmg:1})}. Мешок он не отдаст.`;}
        addLog(`Зомби ${st.name} (${p.name}): ${t}`);return t;})});
    render();
    if(p.hp<=0&&p.mode!=='dead')await die(p,'Зомби оказался сильнее. Герой выбывает из игры.','☠','Погиб');

  }
  x.stash=null;boardFull=true;
  if(v<zc+0.2){addLog(`${p.name}: мешок героя ${st.name} пуст.`);render();
    await modal({icon:'☠',tone:'line',img:'img/dead_hero_on_map.jpg',title:'Пустой мешок',sub:`Здесь погиб ${st.name}`,text:'Ты развязываешь мешок… пусто. Кто-то побывал здесь раньше — вокруг следы крысиных лап.'});return;}
  const g=Math.max(1,Math.round(st.gold*(0.5+RNG()*0.5)));p.gold+=g;sfx('coins');addLog(`${p.name} подобрал мешок героя ${st.name}: +${g} золотых.`);render();
  await modal({icon:'$',tone:'gold',img:'img/dead_hero_on_map.jpg',title:'Мешок павшего героя',sub:`Здесь погиб ${st.name}`,
    text:`Среди костей лежит мешок героя ${st.name}. Крысы успели погрызть его, но кое-что осталось: +${g} золотых.`});
}

async function die(p,text,icon,title,img){

    return;}

    const x=cell(p.r,p.c),old=x.stash&&x.stash.kind==='dead'?x.stash.gold:0;
    x.stash={kind:'dead',gold:p.gold+old,name:p.name,portrait:p.portrait,zombie:!!(x.stash&&x.stash.zombie)};boardFull=true;
    text=text.replace(/,? золото потеряно/,'')+`\n\nМешок с ${p.gold} ${plural(p.gold,'золотым','золотыми','золотыми')} остался лежать на месте гибели. Его может найти другой герой — если проклятие дракона не поднимет павшего.`;
  }

/* ---------- режим «Охотники»: твари бездны выходят на охоту за искателями ----------
   С 4-го раунда каждые 4 раунда появляется охотник (всего трое). Раз в раунд каждый идёт к своей цели сквозь тьму
   (по любым клеткам, кроме бездны и логова). Встал на клетку героя — в начале его хода бой d20.
   Победа — охотник уходит на 3 раунда, поражение — −1 ♥ и часть золота, охотник уходит на 2 раунда.
   Затаиться — пропуск хода, охотники теряют след до следующего хода героя. Плащ-невидимка — 3 хода невидимости. */
const HUNTERS={
  eye:{n:'Тысячеглаз',sense:'gold',dc:14,steps:2,steal:0.4,col:'#c77dff',img:'img/hunter-eye.jpg',ava:'img/hunter-eye-ava.jpg',
    d:'Парящая тварь с сотней глаз. Она видит блеск золота сквозь камень и не отстанет от самого богатого искателя.'},
  hound:{n:'Адская гончая',fem:1,sense:'blood',dc:13,steps:3,steal:0.2,col:'#ff6a2a',img:'img/hunter-hound.jpg',ava:'img/hunter-hound-ava.jpg',
    d:'Огнедышащий пёс бездны. Он быстрее всех и чует кровь — гонится за самым израненным героем.'},
  reaper:{n:'Жнец бездны',sense:'weak',dc:15,steps:2,steal:0.3,col:'#5ee07e',img:'img/hunter-reaper.jpg',ava:'img/hunter-reaper-ava.jpg',
    d:'Безмолвный жнец с ржавой косой. Он выбирает того, у кого больше добычи и меньше сил, — богатого и раненого сразу.'}};
const HUNT_ORDER=['eye','hound','reaper'],HUNT_FIRST=4,HUNT_EVERY=4,HUNT_AWAY=3;
const SENSE_T={gold:'чует золото и идёт за самым богатым',blood:'чует кровь и идёт за самым раненым (пока все целы — за самым богатым)',weak:'чует слабость и идёт за тем, кто богат и изранен'};
const HUNT_AVA={};Object.entries(HUNTERS).forEach(([k,h])=>{const im=new Image();im.src=h.ava;HUNT_AVA[k]=im;});
const md=(a,b,c,d)=>Math.abs(a-c)+Math.abs(b-d);
const huntOn=()=>!!(S&&S.rules==='hunt');
const huntActive=()=>huntOn()?(S.hunters||[]).filter(h=>!h.away):[];
const huntPrey=q=>alive(q)&&(q.mode==='out'||q.mode==='back')&&!q.hidden&&!(q.invis>0);
const huntersHere=p=>huntOn()&&!(p.invis>0)?huntActive().filter(h=>h.r===p.r&&h.c===p.c):[];
function huntTarget(h){
  const sense=HUNTERS[h.k].sense,list=S.players.map((q,i)=>[q,i]).filter(([q])=>huntPrey(q));
  if(!list.length)return -1;
  // кто подошёл к охотнику на 2 клетки и ближе — сам стал добычей, кого бы охотник ни искал
  const near=list.filter(([q])=>md(h.r,h.c,q.r,q.c)<=2);
  if(near.length){near.sort((a,b)=>md(h.r,h.c,a[0].r,a[0].c)-md(h.r,h.c,b[0].r,b[0].c)||(a[1]===h.tgt?-1:b[1]===h.tgt?1:0)||a[1]-b[1]);
    const i=near[0][1];if(i!==h.tgt&&h.tgt!=null)addLog(`${HUNTERS[h.k].n} ${HUNTERS[h.k].fem?'учуяла':'учуял'} рядом ${S.players[i].name} — новая добыча!`);return i;}
  const val=q=>sense==='gold'?q.gold:sense==='blood'?(maxHP(q)-q.hp)*1000+q.gold:q.gold/50+(maxHP(q)-q.hp)*2;
  list.sort((a,b)=>val(b[0])-val(a[0])||md(h.r,h.c,a[0].r,a[0].c)-md(h.r,h.c,b[0].r,b[0].c)||a[1]-b[1]);
  return list[0][1];
}
// откуда выползает охотник: как можно дальше от героев (дальше 7 клеток — уже всё равно), не на краю
function huntSpot(self){
  const heroes=S.players.filter(q=>alive(q)&&q.mode!=='room'),taken=new Set((S.hunters||[]).filter(h=>h!==self&&!h.away).map(h=>K(h.r,h.c)));
  let best=[],bd=-1;
  for(let r=1;r<N-1;r++)for(let c=1;c<N-1;c++){if(!walkable(r,c)||taken.has(K(r,c)))continue;
    const v=Math.min(7,heroes.length?Math.min(...heroes.map(q=>md(r,c,q.r,q.c))):7);
    if(v>bd){bd=v;best=[];}if(v===bd)best.push([r,c]);}
  return best.length?best[rnd(best.length)]:[1,1];
}
function huntMove(h){
  h.tgt=huntTarget(h);
  const t=h.tgt>=0?S.players[h.tgt]:null,steps=t?HUNTERS[h.k].steps:1;
  const occ=(r,c)=>S.hunters.some(o=>o!==h&&!o.away&&o.r===r&&o.c===c);
  let prev=null;
  for(let i=0;i<steps;i++){
    if(t&&h.r===t.r&&h.c===t.c)break;
    const nb=['U','R','D','L'].map(d=>[h.r+D[d][0],h.c+D[d][1]]).filter(([a,b])=>walkable(a,b)&&!occ(a,b)&&!(prev&&a===prev[0]&&b===prev[1]));
    if(!nb.length)break;
    let pick;
    if(t){const cur=md(h.r,h.c,t.r,t.c),sc=nb.map(([a,b])=>md(a,b,t.r,t.c)+RNG()*0.5),j=sc.indexOf(Math.min(...sc));
      if(md(nb[j][0],nb[j][1],t.r,t.c)>cur)break;pick=nb[j];}
    else pick=nb[rnd(nb.length)];   // цели нет — бродит
    prev=[h.r,h.c];h.r=pick[0];h.c=pick[1];
  }
}
function huntRound(){
  S.hunters=S.hunters||[];S.huntNews=S.huntNews||[];
  for(const h of S.hunters){
    if(h.away){if(--h.away===0){[h.r,h.c]=huntSpot(h);h.tgt=huntTarget(h);S.huntNews.push({k:h.k});}continue;}
    huntMove(h);
  }
  if(S.hunters.length<HUNT_ORDER.length&&S.round>=(S.huntNext??HUNT_FIRST)){
    const k=HUNT_ORDER[S.hunters.length],h={id:S.hunters.length,k,r:0,c:0,tgt:-1,away:0};[h.r,h.c]=huntSpot(h);h.tgt=huntTarget(h);
    S.hunters.push(h);S.huntNext=S.round+HUNT_EVERY;delete ambNext['h'+h.id];S.huntNews.push({k,first:true});
    addLog(`${HUNTERS[k].n} ${HUNTERS[k].fem?'вышла':'вышел'} на охоту.`);
  }
  boardFull=true;
}

      text:n.first?`${hd.d}\n\n${hd.n} ${SENSE_T[hd.sense]}. Догонит — бой: d20, нужно ${hd.dc} и больше.\n\nСпастись можно: затаиться (пропуск хода — охотник потеряет след) или накинуть плащ-невидимку. В логове дракона охотники не достанут.\n\nНе подходи близко: кто окажется в 2 клетках от охотника, сам станет его добычей.`

async function hunterFight(p,h,caught){

// можно ли затаиться: no — не нужно/негде, twice — прятался в прошлом ходу, near — охотник уже рядом
function canHide(p){
  if(!huntOn()||!huntActive().length||!(p.mode==='out'||p.mode==='back'))return'no';
  if(p.hidAt!=null&&p.hidAt>=S.round-1)return'twice';
  if(huntActive().some(h=>md(h.r,h.c,p.r,p.c)<=1))return'near';
  return'ok';

async function askHide(){
  const p=P();if(!S||S.phase!=='roll'||rolling||!isLocal(p)||p.cpu||lockedTurn())return;
  const c=canHide(p);
  if(c==='near'){toast('Охотник уже рядом — спрятаться не выйдет. Беги или дерись!',3200);return;}
  if(c==='twice'){toast('Ты прятался в прошлый ход — твари чуют твой след. Сейчас не спрятаться.',3200);return;}

async function voidTeleport(p,m,rad){

  if(!spots.length){addLog(`${p.name}: пустоте некуда тебя выбросить.`);return;}

    text:`Чёрная дыра в груди твари втягивает тебя целиком. Мир гаснет, камни свистят у самого уха — и пустота с отвращением выплёвывает тебя на другую плитку, в ${far} ${plural(far,'клетке','клетках','клетках')} от места боя.`,buttons:o.buttons});

// клетки в радиусе 3 (по шагам), куда можно встать: не логово и не пропасть
function tpSpots(p){
  const out=[];if(p.mode!=='out'&&p.mode!=='back')return out;
  for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++){const k=Math.abs(dr)+Math.abs(dc),r=p.r+dr,c=p.c+dc;if(k&&k<=3&&walkable(r,c)&&!(cell(r,c).block)&&(!coopOn()||descTpOk(r,c)))out.push([r,c]);}
  return out;
}
function cpuTpPick(p,spots){
  const g=([r,c])=>(p.mode==='out'&&!S.awake?dist(r,c):edgeDist(r,c))+RNG()*0.5;
  const sc=spots.map(g);return spots[sc.indexOf(Math.min(...sc))];
}

function pickTile(p,spots){

async function teleportTo(p,[r,c],show){
  if(S.phase==='tp'){S.phase=S.tpPrev||'move';S.tp=null;}
  reveal(r,c,p.mode);revealAhead(r,c,p.mode);const x=cell(r,c);
  p.r=r;p.c=c;newLeg(p);if(p.mode==='out')p.trail.push([r,c]);boardFull=true;

  if(wantLeave(p)&&await askLeave(p)){await escapeHero(p,'Телепорт вынес героя прямо к выходу из подземелья');return;}
  for(const q of rivalsHere(p)){await wait(150);await duel(p,q);}

}
// компьютер: иногда читает свиток против лидера
async function cpuScroll(me){
  if(!canReadScroll(me)||RNG()>0.45)return;
  const lead=q=>q.gold+q.hp*20+(q.mode==='back'?150:0)+(q.mode==='room'?100:0);
  for(const id of shuffle([...new Set(me.scrolls)])){
    const sc=SCROLLS[id];
    if(sc.t==='all'){if(S.players.some(x=>x!==me&&alive(x))){await castScroll(me,id);return;}continue;}
    if(id==='necro'&&me.hp>=maxHP(me))continue;
    if(sc.t==='self'){
      if(sc.self&&sc.self(me))continue;
      if(id==='harmony'&&!(me.burn>0||me.burnTurn||me.jinx>0||me.jinxTurn||me.curse>0||me.curseTurn||me.wound>0||me.woundTurn||me.stun>0))continue;
      if(id==='stone'&&(warded(me)||!S.players.some(x=>x!==me&&alive(x)&&(x.scrolls||[]).some(k=>['one','all'].includes(SCROLLS[k].t)))))continue;
      if(id==='teleport'){const g=([r,c])=>me.mode==='out'?dist(r,c):edgeDist(r,c);if(g([me.r,me.c])-Math.min(...tpSpots(me).map(g))<2)continue;}
      await castScroll(me,id);return;
    }
    let ok=scrollTargets(me,id).filter(x=>!x.why).map(x=>x.q);
    // клеймо имеет смысл, только если отбросит соперника далеко назад: он глубоко в подземелье, ближе к логову, чем к краю
    if(id==='exile')ok=ok.filter(q=>edgeDist(q.r,q.c)>=4&&dist(q.r,q.c)<=edgeDist(q.r,q.c)+2);
    if(!ok.length)continue;
    const pick=id==='exile'?ts=>ts.filter(q=>ok.includes(q)).sort((a,b)=>edgeDist(b.r,b.c)-edgeDist(a.r,a.c)||lead(b)-lead(a))[0]:ts=>ts.filter(q=>ok.includes(q)).sort((a,b)=>lead(b)-lead(a))[0];
    await castScroll(me,id,pick,
      loot=>(loot.find(l=>l[0]==='gold'&&me.gold<200)||loot.find(l=>l[0]==='rope')||loot[0])[0]);
    return;
  }
}

function whyScroll(p,id){

    if(S.phase==='lair')return 'в логове — из окна поиска';
    if(S.phase==='exit')return 'сейчас выбирай край';
    if(S.phase==='tp')return 'сейчас выбери клетку';

const RULES=`<ul>
<li>Играют от 2 до 4 героев: с юга, запада, севера и востока, ходы по кругу. Режимы: против компьютера (1–3 соперника-ИИ), на одном устройстве по очереди и по сети — у каждого свой телефон, вход в комнату по коду из 4 цифр. Карта бывает малая (21×21), средняя (31×31) и большая (41×41).</li>
<li>Правила партии. «Свободное исследование» — без спешки, сколько угодно ходов. «Пробуждение дракона» — гонка со временем: шкала сна дракона растёт каждый раунд (25 раундов на малой карте, 35 на средней, 45 на большой). На половине шкалы дракон ворочается — риск в логове +10%. На трёх четвертях подземелье дрожит: риск в логове +20%, а в начале хода героя может настичь обвал (−1 ♥), провал пола (−1 ♥ и потеря хода) или выплеск лавы (−1 ♥ и 15% золота) — спасает бросок d20. Когда шкала заполнится, дракон просыпается: искать в логове больше нельзя, выбраться можно с любого края подземелья — даже не побывав в логове, а от логова каждый раунд на одно кольцо расползается пламя — кто в начале хода стоит в огне, теряет 1 ♥. Первый вышедший из подземелья получает +25% к добыче, второй — +10%. «Охотники» — с 4-го раунда из тьмы выходят твари и рыщут по подземелью сквозь завалы: Тысячеглаз (2 клетки за раунд) идёт за самым богатым, Адская гончая (3 клетки) — за самым раненым, Жнец бездны (2 клетки) — за богатым и раненым сразу. Новый охотник — каждые 4 раунда, всего трое. Догнал — бой d20 (13–15+): победа прогоняет охотника на 3 раунда, поражение стоит 1 ♥ и 20–40% золота. Спастись можно, затаившись (пропуск хода; нельзя два хода подряд и если охотник уже рядом), или накинув плащ-невидимку — его можно найти в подземелье, он скрывает героя на 3 хода. Кто подошёл к охотнику на 2 клетки, сам становится его добычей. В логове охотники не достают.</li>
<li>В игре по сети хозяин комнаты может включить таймер хода: 30 или 60 секунд. Не успел — этот ход за героя доигрывает компьютер, со следующего хода герой снова твой.</li>
<li>В начале хода брось кубик d4: столько шагов герой сделает в этот ход. Зелье скорости даёт +1 шаг на три хода.</li>
<li>Медный ключ — редкая находка: он без проверки открывает потайную дверь. Без ключа замок вскрывают броском d20 — нужно 19 или больше. В тайнике бывает пусто, а бывают самоцветы (+150), клад (100–150 золотых), редкий предмет, свиток — или монстр-страж.</li>
<li>Хитрый крысюк предлагает сыграть в кости: ставка 20, 50 или 100 золотых, каждый бросает d20 — у кого больше, тот забирает ставку. Но проигравший крысюк иногда хватает обе ставки и удирает (30%).</li>
<li>Зелье здоровья обычно возвращает 1 сердце. Но изредка оно выдохлось и не действует (3%), бывает чудесным и восстанавливает все сердца (1%) — или оказывается ложным: отрава, −1 ♥ и пропуск следующего хода (1%).</li>
<li>Плитка, на которой стоит герой, показывает стрелками свои выходы: С, В, Ю, З или их сочетания. Шаг — в любой из выходов.</li>
<li>У каждой плитки, на которую ты вступил, есть стрелка назад (↩). В открытую плитку можно войти, только если у неё есть выход в твою сторону. Тупик — плитка с одной стрелкой назад.</li>
<li>На новых клетках бывают находки, монстры и ловушки. Бой и ловушка — бросок d20 плюс бонусы против сложности.</li>
<li>В тоннелях бродят братья-грибы: <b>Мухомор</b> продаёт зелья и свитки, <b>Боровик</b> — оружие и снаряжение. Сонных бомб у них нет, а верёвка Боровика гнилая: над пропастью рвётся в 70% случаев (найденная верёвка надёжна).</li>
<li>Логово окружено бездонной пропастью. Перейти её можно только с края обрыва — 3 клетки с каждой стороны: прыжок d20 со сложностью 15 (амулет даёт +3). Провал по пути к логову — бездна уносит героя на случайную плитку у внешнего контура, его пройденный путь рассыпается, и он пропускает 1 ход; провал при выходе — герой остаётся в логове и пропускает 1 ход. Редкая верёвка с крюком позволяет переходить пропасть без проверки. В логове каждый герой находит верёвку, так что уйти из логова можно без риска.</li>
<li>Вошёл в логово — 100 золотых, а пройденный путь рассыпается. Дальше каждый ход: искать (риск 10%, 20%, 30%…) или уходить. Сонная бомба усыпляет самого дракона: безопасные поиски получают все герои в логове (каждый поиск любого героя тратит один), но дракон привыкает к зелью: первая бомба в партии — 3 поиска, вторая — 2, дальше — по 1. Если дракона разбудили, а в логове несколько героев, он сжигает их всех — вместе с золотом.</li>
<li>Обратный путь — по тем же правилам, через новые плитки, до любой клетки внешнего контура.</li>
<li>Кончились сердца, съел дракон или поглотила бездна — герой выбывает. Когда все вернулись или погибли, побеждает выживший с наибольшей добычей.</li>
<li>Мешок павшего. Погибший в подземелье оставляет мешок с золотом на своей клетке (в логове золото забирает дракон, в бездне — бездна). Вошедший на клетку находит: мешок, погрызенный крысами, — 50–100% золота (50%), пустоту (20%) или зомби павшего героя — проклятие дракона (30%, после пробуждения дракона — 50%). Зомби — нежить, бой d20 против 14: победа — весь мешок, поражение — −1 ♥, и зомби остаётся сторожить мешок.</li>
<li>Кобольд-вор не ранит: проиграв ему, теряешь случайный предмет (или 20% золота), а кобольд удирает с ним — в начале каждого твоего хода делает шаг прочь от тебя. Догони его за 4 хода (бой d20 против 10 вернёт добычу), иначе он скроется; добежав до края подземелья, он сбегает сразу. Культист дракона, победив, бьёт в гонг: в «Пробуждении» дракон проснётся на 2 раунда раньше, в «Свободном исследовании» риск в логове +5% для всех; если дракон уже проснулся — проклятие −1 ♥. Детёныш дракона: откупись 30 золотыми, прогони (d20 против 10) или сразись (d20 против 12): победа — +60 золотых, но мать-дракон проснётся сразу, а в «Свободном исследовании» придёт в ярость — риск в логове +15% для всех до конца партии.</li>
<li>Огненный вождь (сложность 16) бьёт факелом: проиграешь — −1 ♥ и ожог на 3 твоих хода: −3 к броскам d20 в бою, зато +1 к броску d4 — горящий герой бежит быстрее (знак 🔥 на карточке). Пустотное тело (сложность 10) выползает из бездны у логова: у внешнего края подземелья его почти не встретить, а на клетках у самой пропасти так выглядят 9 монстров из 10. Проиграешь — −1 ♥, и пустота выбросит тебя на случайную клетку в радиусе 3. Щит и камень судьбы защищают и от этого.</li>
<li>Снаряжение. Щит один раз принимает удар проигранного боя и раскалывается. Кирка один раз пробивает стену из тупика в соседнюю клетку (клетки со знаком ⚒) и ломается. Серебряный клинок даёт +5 в бою с нежитью: скелетами, призраками, вампирами и зомби.</li>
<li>Сделка с демоном: на клетке может ждать демон. Выбор — +150 золотых, но одно сердце уходит демону в залог на 10 твоих ходов (его нельзя вылечить, потом демон вернёт его); редкая реликвия ценой проклятия (3 хода −3 ко всем броскам d20); или отказ.</li>
<li>Свиток «Гармония духа» снимает с тебя заговор, проклятие, рану и оцепенение и даёт +1 ко всем броскам d20 на 2 хода. Свиток «Телепортация» переносит на выбранную клетку в радиусе 3 клеток (не в логово). Камень судьбы — редкий артефакт в сумке свитков: 3 хода на тебя нельзя наложить негативный эффект.</li>
<li>Встреча: если герой встал на клетку с соперником, они бросают d20 против d20 — победитель забирает 25% мешка проигравшего, а проигравший пропускает ход и затем ещё 1 ход получает −3 ко всем проверкам (итог броска не ниже 1). Каждая пара героев встречается так раз за игру. Знак ⚔ на карточке — соперник, чья добыча может стать твоей.</li>
<li>В логове бьётся сердце: чем выше риск разбудить дракона, тем громче и чаще стук, сильнее дрожит экран и вибрирует телефон.</li>
<li>Свитки лежат в сумке свитков (кнопка §). Каждый начинает с одним случайным свитком, ещё их находят в подземелье. В свой ход можно прочитать один свиток — до броска, во время шагов или в логове; после прочтения он исчезает. Сглаз и Призыв зверя наносят урон без броска, Заговор на неудачу делает все проверки цели равными 1 на 2 её хода, Клеймо изгнанника работает только на героя, идущего к логову.</li>
<li>Если все остальные герои погибли, последний сразу побеждает: можно забрать победу или доиграть, чтобы собрать больше. Но погибнешь — победа сгорит.</li><li><b>«Спуск».</b> Раунд идёт в три фазы. 1) <b>Фаза искателей</b>: каждый по очереди тратит очки действий (ОД). 2) <b>Фаза монстров</b>: твари, заметившие отряд, идут к ближайшему герою и нападают. 3) <b>Фаза злодеяния</b>: срабатывает замеченная, но не обезвреженная ловушка зала; в открытом зале, где нет героев, может появиться новый монстр. Телепорт в «Спуске» переносит только в уже открытые залы.</li><li>Лестницу вниз стережёт босс: 1-й этаж — Огр-вышибала (раненого героя отшвыривает назад), 2-й — Король крыс, 3-й — Костяной лорд, 4-й — Королева пауков, 5-й — Повелитель огня, 6-й — Вожак минотавров; дальше круг повторяется, и боссы сильнее. Пещерный тролль (огр) и минотавр бродят как обычные монстры только с 3-го этажа.</li><li><b>Ловушки «Спуска»</b> срабатывают не больше одного раза. Обезвредить (действие, d20) можно только <b>сетку под потолком, шипы из стены, отравленные дротики и ядовитый газ</b>: успех — ловушка не сработает, провал — она срабатывает на того, кто её разбирал. Такую ловушку зала герой замечает, войдя в зал; если до фазы злодеяния её никто не обезвредил, она срабатывает на весь отряд. Остальные ловушки обезвредить нельзя: ловушка зала срабатывает, как только в зал входит первый герой (проверку проходит весь отряд), скрытая ловушка на клетке — когда на неё наступают. Скрытую ловушку рядом иногда удаётся заметить заранее и обойти.</li><li>ОД = скорость + 2. Скорость — бросок d4 в начале хода: столько клеток можно пройти. Ещё 1 <b>атака</b> (бой с монстром) и 1 <b>действие</b>: открыть дверь в неоткрытый зал, обезвредить ловушку, поднять соратника без сил, сменить оружие или передать вещь соратнику рядом (в инвентаре), купить у грибного торговца. В уже открытый зал (и в только что открытый) проходишь за обычные шаги. Когда герой подходит к двери, ловушке, торговцу или павшему соратнику, всплывает вопрос «Да / Нет». Когда делать больше нечего, ход переходит сам; иначе нажми «Завершить ход».</li><li>В «Спуске» и в игре по сети у каждого свой герой: занятый портрет выбрать нельзя.</li></ul>`;

$('bMenu').onclick=async()=>{

  const items=[{label:'Продолжить',cls:'primary',value:'go'}];
  if(S.soloOffered&&alive(P())&&isLocal(P())&&!busy&&S.players.filter(alive).length===1)items.push({label:`Забрать победу — ${P().gold} золотых`,cls:'heal',value:'claim'});

  if(v==='claim'){act('claim');return;}

  if(v==='tips'){tipsOn=!tipsOn;if(tipsOn)tipsSeen=new Set();else coachHide();saveTips();toast(tipsOn?'Подсказки включены — они снова появятся в нужный момент.':'Подсказки выключены.',2600);setTimeout(()=>$('bMenu').click(),0);return;}
  if(v==='restart'){const ok=await modal({local:true,icon:'↻',tone:'fire',title:'Начать заново?',text:'Партия начнётся сначала с теми же настройками: те же герои, режим и размер карты. Текущий прогресс будет потерян.',buttons:[{label:'Отмена',value:false},{label:'Начать заново',cls:'danger',value:true}]});if(ok)restartGame();}
  if(v==='quit'){
    if(S.online){const ok=await modal({local:true,icon:'!',tone:'fire',title:'Выйти из партии?',text:'Твоим героем дальше будет играть компьютер.',buttons:[{label:'Остаться',value:false},{label:'Выйти',cls:'danger',value:true}]});if(ok){netLeave();leaveToMenu();}}
    else{const ok=await modal({local:true,icon:'!',tone:'fire',title:'Выйти из партии?',text:S.mission||S.players.some(q=>!q.cpu&&alive(q))?'Партия сохранится — её можно будет продолжить из главного меню.':'Ты вернёшься в главное меню.',buttons:[{label:'Остаться',value:false},{label:'Выйти',cls:'danger',value:true}]});if(ok){saveGame();leaveToMenu();}}
  }
  }finally{inMenu=false;}
};
// выйти из партии в самое первое меню: партия останавливается (офлайн — сохранена заранее)
function leaveToMenu(){
  stopHeart();coachHide();closeCharSheet();clearTimeout(peekTimer);peekTimer=null;
  if(S)S.over=true;busy=false;rolling=false;
  campJump=false;lessonJump=false;arenaJump=false;arenaPartyJump=false;
  newGame();
}
// «Начать заново»: та же партия с теми же настройками (герои, режим, правила, размер карты; миссия — та же миссия)
function restartGame(){
  if(!S||S.online)return;
  const g=S;stopHeart();coachHide();closeCharSheet();clearTimeout(peekTimer);peekTimer=null;
  clearSave();g.over=true;busy=false;rolling=false;
  if(g.mission){startMission(g.mission);return;}
  const mapKey=Object.keys(MAP_SIZES).find(k=>MAP_SIZES[k]===g.N)||'small';
  const players=g.players.map(q=>({seat:q.seat,name:q.name,portrait:q.portrait,cpu:!!q.cpu}));
  startGame(players,mapKey,{rules:g.rules});
}
