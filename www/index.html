<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-visual">
<title>Логово дракона 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: мобильное приложение на весь экран — гербы героев сверху, поле в рамке посередине, панель хода с шестиугольным инвентарём снизу; события всплывают окном поверх поля.
   Стиль: ночная синева, тонкие серебристо-голубые двойные рамки с ромбами по углам, заголовки капителью на ленте, золотые цифры. */
:root{
  color-scheme: dark;
  --bg:#071024;
  --bg-hi:#14305f;
  --panel-hi:#16305c;
  --panel:#0f2247;
  --panel-lo:#0a1733;
  --frame:#7d9ccc;
  --frame-in:#2d4a7a;
  --frame-hi:#c9dcf5;
  --glow:#7fd3ff;
  --line:#2d4a7a;
  --fog:#0e1c3a;
  --tile:#213e6b;
  --wall:#040a17;
  --ink:#e6eef9;
  --muted:#8fa6c8;
  --gold:#ecc66a;
  --gold-lo:#9c7630;
  --lair:#3d1220;
  --fire:#ea5a44;
  --good:#7fd88a;
  --sleep:#8fc7ff;
  --p1:#5fd0c1;
  --p2:#c792ea;
  --p3:#f59e5b;
  --p4:#ff7eb6;
  --display:"Forum", "Cormorant SC", "Times New Roman", serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  background-color:var(--bg);
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 68% 9%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 83% 41%, rgba(190,220,255,.5), transparent 60%),
    radial-gradient(1px 1px at 31% 63%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 54% 87%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 92% 76%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg-hi), transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 100%, #0d2148, transparent 70%);
  background-size:180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,100% 100%,100% 100%;
  display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));padding-block:10px 8px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{flex:1;min-height:0;width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:9px}

/* общая рамка панелей: внешняя светлая линия, тёмный зазор, внутренняя линия и ромбы по верхним углам */
.frame{position:relative;background:linear-gradient(180deg,var(--panel-hi),var(--panel) 45%,var(--panel-lo));
  border:1px solid var(--frame);border-radius:5px;
  box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--frame-in),0 8px 22px -6px rgba(0,0,0,.65)}
.frame::before,.frame::after{content:"";position:absolute;top:-4px;width:7px;height:7px;background:var(--frame-hi);
  transform:rotate(45deg);box-shadow:0 0 6px var(--glow);pointer-events:none}
.frame::before{left:12px}.frame::after{right:12px}

/* гербы героев */
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:700px){.top.n3{grid-template-columns:repeat(3,1fr)}.top.n4{grid-template-columns:repeat(4,1fr)}}
.pill{padding:6px 10px 6px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;align-items:center;min-width:0;transition:box-shadow .25s,border-color .25s}
.pill.active{border-color:var(--pc);box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--pc),0 0 18px -4px var(--pc),0 8px 22px -6px rgba(0,0,0,.65)}
.pill.out{filter:grayscale(.8) brightness(.6)}
.pill{cursor:pointer}.pill:active{transform:scale(.98)}
.crest img,.micon img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.micon.pic{padding:0;overflow:hidden}
.crest{overflow:hidden;grid-row:1/3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:19px;color:var(--ink);
  background:radial-gradient(circle at 35% 30%,var(--panel-hi),var(--panel-lo));
  box-shadow:0 0 0 2px var(--pc),0 0 0 3px var(--panel-lo),0 0 0 4px var(--gold-lo),0 0 12px -2px var(--pc)}
.pl1{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.pname{font-family:var(--display);font-size:16px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hp{margin-left:auto;color:var(--fire);letter-spacing:1px;font-size:14px;text-shadow:0 0 6px rgba(234,90,68,.45)}
.hp .hplock{color:#5b4a6e;text-shadow:none}
.pl2{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0;white-space:nowrap}
.coin{display:inline-flex;align-items:center;gap:4px}
.tro{display:inline-flex;align-items:center;gap:3px;color:#e88a6a}.tro b{color:#ffb08f!important;font-size:14px!important}
.coin::before{content:"";width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c2,var(--gold) 45%,var(--gold-lo));box-shadow:0 0 0 1px #5e4618}
.pl2 b{color:var(--gold);font-size:15px;font-weight:800}
.inv{display:flex;gap:5px;margin-left:auto;min-width:0;overflow:hidden;flex-wrap:nowrap}
.pl2{overflow:hidden}
.inv .g{color:var(--good)} .inv .s{color:var(--sleep)} .inv .f{color:var(--fire)}
.ai{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--panel-lo);background:var(--pc);border-radius:3px;padding:1px 4px;flex:none}
@media (max-width:699px){.top.n3 .st,.top.n4 .st{display:none}.top.n3 .pill,.top.n4 .pill{padding:5px 7px 5px 5px}.top.n3 .crest,.top.n4 .crest{width:30px;height:30px;font-size:16px}.top.n3 .pname,.top.n4 .pname{font-size:14px}}

/* поле */
.board{flex:1;min-height:0;overflow:auto;display:flex;padding:5px;background:var(--wall);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.board.frame{background:var(--wall)}
.stage{position:relative;margin:auto;flex:none;contain:strict}
canvas{display:block;touch-action:pan-x pan-y;cursor:pointer}
#fx{position:absolute;inset:0;pointer-events:none}
#fog{position:absolute;pointer-events:none;display:none}
#dark{position:absolute;inset:0;pointer-events:none;animation:dkFlick 3.2s infinite}
@keyframes dkFlick{0%,100%{opacity:1}18%{opacity:.95}27%{opacity:.99}46%{opacity:.93}61%{opacity:1}79%{opacity:.96}}
@media (prefers-reduced-motion:reduce){#dark{animation:none}}

/* слот поля: кубик движения в правом нижнем углу, не скроллится с картой */
.boardslot{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.diehud{position:absolute;right:8px;bottom:8px;z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.diehud[hidden]{display:none!important}
.diehud .dieacts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:min(260px,70vw);pointer-events:auto}
.diehud .dieacts:not(:has(button:not([hidden]))){display:none}
.movedie{pointer-events:auto;box-sizing:border-box;width:76px;height:76px;min-width:76px;min-height:76px;padding:0;margin:0;border-radius:8px;
  display:grid;place-items:center;cursor:default;color:inherit;font:inherit;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel) 45%,var(--panel-lo));
  box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--frame-in),0 8px 18px -6px rgba(0,0,0,.65)}
.movedie .d4{width:56px;height:52px;font-size:22px}
.movedie.ready{cursor:pointer}
.movedie.rolling .d4{animation:d4spin .18s linear infinite}
.movedie.done .d4{animation:rpPop .35s ease-out}
.movedie.nudge{animation:dieNudge 1.25s ease-out}
@keyframes dieNudge{
  0%,100%{box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--frame-in),0 0 0 0 rgba(236,198,106,0),0 8px 18px -6px rgba(0,0,0,.65)}
  18%{box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--gold),0 0 18px 5px rgba(236,198,106,.95),0 0 36px 10px rgba(255,220,120,.55)}
}
.rollhint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;opacity:0;
  max-width:92vw;padding:7px 16px;border-radius:6px;border:1px solid var(--gold);
  background:linear-gradient(180deg,rgba(24,50,96,.94),rgba(8,18,40,.96));
  box-shadow:0 0 0 3px rgba(8,18,40,.85),0 8px 20px rgba(0,0,0,.6),0 0 18px rgba(236,198,106,.22);
  font-family:var(--display);font-size:18px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  color:var(--gold);text-align:center;text-shadow:0 2px 12px #000,0 0 18px rgba(236,198,106,.35)}
.rollhint.on{opacity:1;animation:rollhintIn .15s ease-out,rollhintOut .55s ease-in 1s forwards}
@keyframes rollhintIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes rollhintOut{to{opacity:0;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){.movedie.nudge{animation:none;box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--gold),0 0 18px 5px rgba(236,198,106,.8)}
  .rollhint{animation:none}}
.movedie:disabled{opacity:1;cursor:default;filter:none}
.movedie:hover:not(.ready):not(:disabled){border-color:var(--frame);box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--frame-in),0 8px 18px -6px rgba(0,0,0,.65)}
body.cpu-turn .movedie{cursor:default;filter:none}
@media (max-width:400px){.movedie{width:68px;height:68px;min-width:68px;min-height:68px}.movedie .d4{width:50px;height:46px;font-size:20px}.diehud{right:6px;bottom:6px}}

/* панель хода */
.bottom{padding:0 12px 13px;display:flex;flex-direction:column;gap:9px}
.ribbon{align-self:center;margin-top:-1px;padding:6px 20px 7px;min-width:52%;text-align:center;
  font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--pc,var(--ink));
  background:linear-gradient(180deg,var(--panel-lo),#081430);border:1px solid var(--frame);border-top:0;border-radius:0 0 8px 8px;
  box-shadow:inset 0 -1px 0 var(--frame-in),0 4px 10px -4px rgba(0,0,0,.6);overflow:hidden;max-width:100%;
  white-space:nowrap;text-overflow:ellipsis}
.ribbon .whoname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon .whohint{display:none}
.msgrow{display:flex;align-items:center;gap:10px}
.msg{display:none}
.d4{position:relative;flex:none;width:52px;height:48px;min-height:0;padding:0 0 4px;border:0;border-radius:0;box-shadow:none;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#241a06;font-family:var(--display);font-size:20px;line-height:1}
.d4::before,.d4::after{content:"";position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:0}
.d4::before{inset:0;background:linear-gradient(180deg,#fff2c4,var(--gold) 50%,#8c6522)}
.d4::after{inset:3px 4px 2px;background:linear-gradient(180deg,#f7dc8e,#d7a845 60%,#b98a32)}
.d4>*{position:relative;z-index:1}
.d4 small{font-family:var(--body);font-size:8.5px;font-weight:800;letter-spacing:.06em;opacity:.75;margin-top:1px}
.d4:disabled{opacity:1;filter:saturate(.35) brightness(.55)}
.d4:hover:not(:disabled){box-shadow:none}
.d4.ready{animation:d4pulse 1.1s ease-in-out infinite;cursor:pointer}
.d4.rolling{animation:d4spin .18s linear infinite}
@keyframes d4pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(236,198,106,.4))}50%{filter:drop-shadow(0 0 10px rgba(236,198,106,.95))}}
@keyframes d4spin{from{transform:rotate(0)}to{transform:rotate(120deg)}}
.rollpop{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(4,10,24,.55),rgba(4,10,24,0) 60%)}
.rollcard{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 20px 14px;width:min(240px,80vw);
  border-color:var(--pc,var(--frame));animation:rpIn .22s ease-out;cursor:pointer;color:var(--ink);font:inherit}
.rollcard.frame{background:linear-gradient(180deg,var(--panel-hi),var(--panel) 45%,var(--panel-lo));
  box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--frame-in),0 0 30px -6px var(--pc,transparent),0 18px 40px -8px rgba(0,0,0,.75)}
.rollcard:hover:not(:disabled){border-color:var(--pc,var(--frame-hi))}
.rp-who{font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--pc,var(--gold));text-transform:uppercase}
.rp-die{position:relative;width:96px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;color:#241a06}
.rp-die::before,.rp-die::after{content:"";position:absolute;clip-path:polygon(50% 0,100% 100%,0 100%)}
.rp-die::before{inset:0;background:linear-gradient(180deg,#fff2c4,var(--gold) 50%,#8c6522)}
.rp-die::after{inset:5px 7px 3px;background:linear-gradient(180deg,#f7dc8e,#d7a845 60%,#b98a32)}
.rp-die>*{position:relative;z-index:1}
.rp-die b{font-family:var(--display);font-size:38px;line-height:1;font-weight:400}
.rp-die small{font-size:10px;font-weight:800;letter-spacing:.08em;opacity:.7}
.rp-die.rolling{animation:d4spin .16s linear infinite}
.rollcard.ready .rp-die{animation:d4pulse 1.1s ease-in-out infinite}
.rollpop.done .rp-die{animation:rpPop .35s ease-out}
.rp-hint{font-size:14px;color:var(--muted)}
.rpwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.rpskip{pointer-events:auto;min-height:36px;padding:6px 18px;font-size:14px;font-weight:700;color:var(--muted);
  background:rgba(10,23,51,.92);border:1px solid var(--frame-in);border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.rpskip:hover{color:var(--ink);border-color:var(--frame-hi)}
.rprow{display:flex;gap:8px;justify-content:center}.rprow:not(:has(button:not([hidden]))){display:none}
.rpskip.rphunt{color:#d9c8ff;border-color:rgba(170,130,255,.55)}
.rollpop.done .rp-hint{color:var(--gold);font-weight:800;font-size:16px}
@keyframes rpIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes rpPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.cnt.maps button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1}
.cnt.maps small{font-size:10.5px;font-weight:600;opacity:.75;letter-spacing:.02em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hexes{display:flex;gap:5px;min-width:0;flex:1 1 auto;overflow:hidden}
.hex{--hs:46px;position:relative;width:var(--hs);height:calc(var(--hs)*1.1);flex:none;padding:0;min-height:0;border:0;border-radius:0;background:none;
  display:grid;place-items:center;color:var(--ink);font-size:20px;cursor:default}
.hex::before,.hex::after{content:"";position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex::before{inset:0;background:linear-gradient(180deg,var(--frame-hi),var(--frame) 40%,var(--frame-in))}
.hex::after{inset:2px;background:radial-gradient(circle at 50% 35%,#1b3766,var(--panel-lo) 70%)}
.hex>span{position:relative;z-index:1;line-height:1}
.hex .n{position:absolute;z-index:2;bottom:1px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--gold);
  background:var(--panel-lo);border:1px solid var(--gold-lo);border-radius:7px;padding:0 4px;line-height:13px;font-variant-numeric:tabular-nums}
.hex.empty>span{opacity:.18;filter:grayscale(1)}
.hex.g>span{color:var(--good)} .hex.s>span{color:var(--sleep)} .hex.y>span{color:var(--gold)} .hex.f>span{color:var(--fire)}
button.hex{cursor:pointer;background:none;border:0;box-shadow:none;border-radius:0}
button.hex:hover:not(:disabled){box-shadow:none}
.hex .n:empty{display:none}
button.hex:not(:disabled)::before{background:linear-gradient(180deg,#d8ffe0,var(--good) 45%,#2f6b3b)}
button.hex:not(:disabled){filter:drop-shadow(0 0 6px rgba(127,216,138,.45))}
button.hex:disabled{opacity:1}
.tools{display:flex;gap:6px;flex:none}
.scrollbtn{position:relative;font-family:var(--display);font-size:22px}
.scrollbtn.has:not(:disabled){color:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--panel-lo),inset 0 0 0 3px #8c6522,0 0 12px -3px rgba(236,198,106,.6)}
.scrollbtn .n{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#241a06;font:800 11px/17px var(--body);padding:0 4px}
.scrollbtn .n:empty{display:none}
.invbtn{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",var(--display),sans-serif;font-size:18px}
.invbtn .invico{display:block;line-height:1;transform:translateY(.5px)}
.scrolls{font-size:14px;color:var(--muted)}
.scrolls b{color:var(--gold)}
#mbtns button.tgt{color:var(--ink)}
.round{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1}
@media (max-width:440px){.hex{--hs:37px;font-size:16px}.round{width:38px;height:38px;font-size:16px}.hexes{gap:3px}.tools{gap:4px}}
@media (max-width:400px){.hex{--hs:32px;font-size:14px}.round{width:35px;height:35px;font-size:15px}.scrollbtn{font-size:19px}.invbtn{font-size:16px}}


/* лист персонажа: отдельный оверлей, чтобы не перехватывать боевые окна #modal */
#charsheet{z-index:19;align-items:stretch}
/* карточки героев остаются поверх затемнения, чтобы можно было открыть лист другого */
body.cs-open .top{position:relative;z-index:22}
body.cs-open #charsheet{padding-top:var(--cs-top,16px)}
#csheet{width:100%;max-width:400px;max-height:100%;margin:auto;overflow:hidden;gap:10px;min-height:0;display:flex;flex-direction:column}
#csbody{overflow:auto;min-height:0;flex:1 1 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:4px}
.cshead{display:flex;align-items:center;gap:12px}
.cshead .crest{flex:none}
.csid{min-width:0}
.csstats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-variant-numeric:tabular-nums;font-size:15px}
.csstats .hp{margin-left:0;font-size:16px}
.cssec{margin:14px 0 0}
.cssec h3{margin:0 0 2px;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}
.csrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-height:44px}
.csrow .csico{font-size:22px;line-height:1;text-align:center}
.csrow .csico.g{color:var(--good)} .csrow .csico.s{color:var(--sleep)} .csrow .csico.y{color:var(--gold)} .csrow .csico.f{color:var(--fire)}
.csrow b{font-size:15px;font-weight:700}
.csrow small{display:block;color:var(--muted);font-size:13px;line-height:1.35;font-weight:500;margin-top:1px}
.cscnt{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;align-self:start;padding-top:2px}
.csrow.hasact{align-items:start}
.csacts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:104px;padding-top:1px}
.csact{min-height:40px;padding:7px 12px;font-size:13.5px;letter-spacing:.01em;white-space:nowrap}
.csact:disabled{opacity:.58}
.cswhy{font-size:11px;color:var(--muted);text-align:right;max-width:128px;line-height:1.25;font-weight:600}
.csfx{display:flex;flex-wrap:wrap;gap:4px;width:100%;margin-top:4px}

/* кнопки */

button:hover:not(:disabled){border-color:var(--frame-hi);box-shadow:inset 0 0 0 2px var(--panel-lo),inset 0 0 0 3px var(--frame),0 0 12px -2px var(--glow)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
button:disabled{opacity:.38;cursor:default}
button.primary{color:#241a06;border-color:#f6dc95;background:linear-gradient(180deg,#f7dc8e,var(--gold) 45%,#b98a32);

button.heal{color:var(--good);border-color:var(--good)}
button.sleep{color:var(--sleep);border-color:var(--sleep)}

/* всплывающее окно */
.modal{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 40%,rgba(10,24,52,.55),rgba(2,6,16,.82));display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:400px;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;

.sheet.frame{box-shadow:inset 0 0 0 3px var(--panel-lo),inset 0 0 0 4px var(--frame-in),0 0 40px -12px var(--tone,transparent),0 24px 60px -10px rgba(0,0,0,.8)}

  background:radial-gradient(circle at 35% 30%,var(--panel-hi),var(--panel-lo));
  box-shadow:0 0 0 2px var(--tone,var(--frame)),0 0 0 4px var(--panel-lo),0 0 0 5px var(--gold-lo),0 4px 14px rgba(0,0,0,.6)}
.mtitle{font-family:var(--display);font-size:27px;line-height:1.05;letter-spacing:.05em;color:var(--tone,var(--gold));text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.5)}

.mroll{display:flex;align-items:center;gap:14px;background:var(--panel-lo);border:1px solid var(--frame-in);border-radius:4px;padding:10px}
.die{width:62px;height:68px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:31px;box-sizing:border-box;

.die.idle{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.04em;padding-top:36px}

@keyframes spin{from{transform:rotate(-260deg) scale(.5)}to{transform:none}}
.dc{font-size:15px;color:var(--muted)}
.dc b{color:var(--ink);font-size:17px}
.mbtns{display:flex;flex-direction:column;gap:8px}
.mtext.pre{white-space:pre-line}
.nms{display:flex;flex-direction:column;gap:8px}
.cnt{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}

.cnt button{flex:1;min-width:0;min-height:40px;padding:6px 8px}
.cnt button.on{color:#241a06;border-color:#f6dc95;background:linear-gradient(180deg,#f7dc8e,var(--gold) 45%,#b98a32);box-shadow:inset 0 0 0 2px rgba(255,248,220,.35),inset 0 0 0 3px #8c6522}
.cnt .vs{flex:1.6}
.cpuhint{font-size:14px;color:var(--muted);margin:-2px 0 10px}
#mbtns button.auto{pointer-events:none;filter:grayscale(1) brightness(.75)}
#mbtns button.auto.pick{filter:grayscale(1) brightness(.95)}
body.cpu-turn .bottom button,body.cpu-turn .bottom .hex{filter:grayscale(1) brightness(.7);cursor:default}

#mbtns button.auto:not(.pick){opacity:.45}
#mbtns button.pick{outline:2px solid var(--glow);outline-offset:2px}
.pt{flex:none;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:0;background:none;box-shadow:0 0 0 2px var(--pc),0 0 0 3px var(--panel-lo),0 0 0 4px var(--gold-lo);overflow:hidden}
.pt img{width:100%;height:100%;display:block}
.pt:hover:not(:disabled){box-shadow:0 0 0 2px var(--pc),0 0 0 3px var(--panel-lo),0 0 0 4px var(--gold),0 0 10px var(--pc)}
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;margin-top:-4px;background:var(--panel-lo);border:1px solid var(--frame-in);border-radius:4px}

.pk button.taken{opacity:.45}
.nm{display:flex;align-items:center;gap:10px;background:var(--panel-lo);border:1px solid var(--frame-in);border-radius:4px;padding:5px 4px 5px 8px}

.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 6px var(--pc)}

.res div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;padding:6px 10px;background:var(--panel-lo);border:1px solid var(--frame-in);border-radius:3px}
.g{color:var(--good)} .f{color:var(--fire)} .s{color:var(--sleep)} .y{color:var(--gold)}
/* режимы, лобби, сетевые подсказки */
.cnt.modes button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;font-size:14px}
.cnt.modes small{font-size:10.5px;font-weight:600;opacity:.75}

.cnt.rules small,.cnt.tmrs small{font-size:10.5px;font-weight:600;opacity:.75}
/* строка состояния: шкала сна дракона и таймер хода */
.srow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:24px}
.mgoal{flex:1 1 100%;display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.mgoal{cursor:pointer}.mgoal i{font-style:normal;color:var(--gold)}
.mgoal .mst{margin-left:auto;flex:none;font-style:normal;display:flex;gap:1px;padding:1px 6px;border:1px solid var(--frame-in);border-radius:10px;background:rgba(0,0,0,.3)}
.mgoal .mst i{font-size:13px;color:var(--muted);opacity:.45}.mgoal .mst i.ok{color:var(--gold);opacity:1;text-shadow:0 0 6px rgba(236,198,106,.7)}.mgoal .mst i.fail{color:var(--fire);opacity:.9}
.mrows{display:flex;flex-direction:column;gap:8px}.mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--frame-in);background:rgba(0,0,0,.2)}
.mrow i{font-style:normal;font-size:18px;width:20px;text-align:center;color:var(--muted)}.mrow span{display:flex;flex-direction:column;font-weight:700}.mrow small{font-weight:500;opacity:.75;font-size:13px}
.mrow.ok i{color:var(--gold)}.mrow.ok{border-color:rgba(236,198,106,.55)}.mrow.fail i{color:var(--fire)}.mrow.fail{opacity:.75}.mrow.main i{color:var(--gold)}
.mnote{margin:10px 0 0;font-size:12.5px;opacity:.7}.mgoal b{color:var(--gold);font-weight:700;overflow:hidden;text-overflow:ellipsis}.mgoal span{flex:none;font-variant-numeric:tabular-nums}
.mmhead{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:2px;padding:6px 28px 8px;background:radial-gradient(ellipse at center,rgba(5,8,18,.78),rgba(5,8,18,.45) 55%,rgba(5,8,18,0) 75%)}.mmhead b{font:400 24px var(--display);color:var(--gold);text-shadow:0 2px 10px #000}.mmhead small{font-size:13.5px;color:#d9ccaa;text-shadow:0 1px 6px #000,0 0 2px #000}
/* тип партии: выбранные правила — крупно и со свечением */
.mmhead .mmrule{margin-top:4px;font:400 clamp(30px,4.6vh,38px)/1.1 var(--display);color:#fff4cc;letter-spacing:.03em;opacity:1;
  text-shadow:0 0 6px rgba(255,214,120,1),0 0 16px rgba(236,198,106,.95),0 0 34px rgba(255,170,60,.7),0 2px 4px #000;animation:mmglow 2.6s ease-in-out infinite}
.mmhead .mmruled{font-size:13.5px;color:#e8d9b0;opacity:.9;text-shadow:0 1px 6px #000}
@keyframes mmglow{50%{text-shadow:0 0 8px rgba(255,224,140,1),0 0 22px rgba(236,198,106,1),0 0 48px rgba(255,170,60,.85),0 2px 4px #000}}
/* «← Назад»: вдвое меньше и с отступом от остальных кнопок */
.mmbtns .mmback,#mbtns button.mback{align-self:center;justify-content:center;width:50%;min-width:120px;min-height:34px;padding:4px 10px;font-size:13.5px;color:var(--muted);margin-top:12px}
#mbtns button.mback{width:50%}
/* в лобби вместо кнопок правил — название правил крупно */
.lobrule{display:flex;flex-direction:column;align-items:center;margin:0 0 12px}

.inmenu-sub{color:var(--muted)}
.camp{display:flex;flex-direction:column;gap:8px;margin-top:4px}

/* ===== главное меню в стиле «драконьей арки» (чёрный фон, пиксельная арка, каменные кнопки) ===== */

<!-- Заставка студии при каждом запуске: белый экран, логотип 514+lab плавно появляется и исчезает, затем белый фон тает и открывается игра.
     Игра, 3D и загрузка ресурсов идут под заставкой параллельно; если загрузка дольше — после заставки виден обычный загрузчик игры.
     Тап по заставке — пропустить. При prefers-reduced-motion — короче и без плавности. -->
<style>
#splash{position:fixed;inset:0;z-index:100000;background:#fff;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .5s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
#splash img{width:min(60vw,50vh);height:auto;max-width:512px;opacity:0;transition:opacity .8s ease;user-select:none;-webkit-user-drag:none;pointer-events:none}
#splash.in img{opacity:1}
#splash.out img{opacity:0}
#splash.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){#splash,#splash img{transition:none}}
</style>
<div id="splash" aria-label="514+lab studio" role="img"><img src="img/logo_514lab.png" alt="514+lab studio" width="512" height="512" decoding="async"></div>
<script>
(function(){
  var el=document.getElementById('splash');if(!el)return;
  var img=el.querySelector('img'),rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var IN=800,HOLD=1200,OUT=800,FADE=500,ts=[],done=false,started=false;
  function later(f,ms){ts.push(setTimeout(f,ms));}
  function kill(){if(el.parentNode)el.parentNode.removeChild(el);window.SPLASH_DONE=true;
    try{window.dispatchEvent(new Event('splashdone'));}catch(e){}
    // после заставки на экране обязательно должно быть меню (или идущая партия) — проверяем сейчас и ещё пару раз
    [0,800,2500,6000].forEach(function(ms){setTimeout(function(){try{if(window.ensureMenu)window.ensureMenu();}catch(e){}},ms);});}
  function finish(){if(done)return;done=true;ts.forEach(clearTimeout);el.classList.add('out');el.classList.add('gone');
    setTimeout(kill,rm?0:FADE);setTimeout(kill,rm?50:FADE+1500);}   // второй вызов — на случай, если первый таймер «уснул»
  function run(){if(started||done)return;started=true;
    if(rm){img.style.opacity=1;later(finish,1200);return;}
    // отсчёт — от реального начала появления (первый кадр): пока под заставкой стартует игра, кадры могут задерживаться
    requestAnimationFrame(function(){requestAnimationFrame(function(){if(done)return;el.classList.add('in');
      later(function(){el.classList.add('out');},IN+HOLD);
      later(finish,IN+HOLD+OUT);});});
    later(finish,6000);}   // страховка: заставка не дольше 6 с
  // старт, когда логотип готов (он маленький), но не позже чем через 1 с
  if(img.complete&&img.naturalWidth)run();else{img.onload=run;img.onerror=finish;setTimeout(run,1000);}
  setTimeout(finish,7000);   // общая страховка: заставка не может остаться на экране
  // пропуск по тапу; событие не гасим — разблокировка звука в игре работает как обычно
  el.addEventListener('click',finish);
  window.skipSplash=finish;
})();
</script>

<script>
// ===== LOGIC-START: правила поля и движения (без интерфейса) =====
// Размер поля задаётся при старте партии: 21 (малая), 31 (средняя), 41 (большая).
let N=21, C=10;
const MAXHP=3;
// сердце, отданное демону, заперто: пока идёт срок, его нельзя вылечить
const maxHP=p=>MAXHP-((p&&p.lock>0)?1:0);
const MAP_SIZES={small:21,medium:31,large:41};
const D={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
const OPP={U:'D',D:'U',L:'R',R:'L'};
const ring=(r,c)=>Math.max(Math.abs(r-C),Math.abs(c-C));
// «Спуск» идёт без логова: в нём центр — обычные плитки (функция-объявление, чтобы её можно было звать до let S)
function coopOn(){try{return !!(S&&S.rules==='descent');}catch(e){return false;}}
const inRoom=(r,c)=>ring(r,c)<=1&&!coopOn();                 // логово 3×3
const inChasm=(r,c)=>ring(r,c)===2&&!coopOn();               // бездонная пропасть вокруг логова
const inB=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
const onEdge=(r,c)=>r===0||c===0||r===N-1||c===N-1;
const dist=(r,c)=>Math.abs(r-C)+Math.abs(c-C);
const K=(r,c)=>r*N+c;
// Край обрыва: 12 клеток, откуда через пропасть виден вход в логово (по 3 с каждой стороны)
let EXITS=[];
function jumpDir(r,c){
  if(ring(r,c)!==3)return null;
  if(r===C-3&&Math.abs(c-C)<=1)return'D';
  if(r===C+3&&Math.abs(c-C)<=1)return'U';
  if(c===C-3&&Math.abs(r-C)<=1)return'R';
  if(c===C+3&&Math.abs(r-C)<=1)return'L';
  return null;
}
function setMapSize(n){
  N=n;C=(n-1)>>1;
  EXITS=[];for(let i=-1;i<=1;i++)EXITS.push([C-3,C+i],[C+3,C+i],[C+i,C-3],[C+i,C+3]);
}
setMapSize(21);
// Вся случайность игры идёт через RNG(). В сетевой партии у всех телефонов одно зерно — и одинаковая игра.
let RNG=Math.random;
function seedRNG(seed){let a=seed>>>0;RNG=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const rnd=n=>Math.floor(RNG()*n);
// перемешивание без sort(()=>random): порядок вызовов sort разный в разных браузерах
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const between=([a,b])=>a+rnd(b-a+1);
const EVENTS=[['gold',3.5],['chest',1.8],['potion',2.4],['haste',1.2],['amulet',1],['sword',0.9],['map',0.9],['bomb',0.55],['rope',0.5],['scroll',1.6],['demon',0.8],['stone',0.35],['key',0.35],['door',0.45],['rat',0.7],['kobold',0.6],['cultist',0.5],['whelp',0.35],['shield',0.5],['pick',0.45],['silver',0.4],['merchP',0.42],['merchW',0.42],['cache',0.9],['ghost',0.25],['mantle',0.12],['monster',4.3],['trap',3.8]];
const pickW=list=>{let t=list.reduce((s,x)=>s+x[1],0),v=RNG()*t;for(const x of list){if((v-=x[1])<0)return x[0];}return list[0][0];};
let S;
const cell=(r,c)=>S.cells[r][c];
// тупик — открытая плитка с единственным выходом (только назад); край обрыва тупиком не считается
const dead=(r,c)=>{const x=cell(r,c);return x.rev&&x.arrows.length<=1&&!jumpDir(r,c);};
const blank=()=>({rev:false,arrows:[],ev:null,visited:false});
const walkable=(r,c)=>inB(r,c)&&!inRoom(r,c)&&!inChasm(r,c);

// Плитка: набор выходов из С/В/Ю/З (U/R/D/L).
// Плитка, на которую герой вступил, ВСЕГДА имеет выход назад — к плитке, с которой он пришёл.
// Число выходов вместе с обратным: 1 — тупик, 2 — проход/поворот, 3 — тройник, 4 — перекрёсток.
// В пропасть выходы не ведут, кроме края обрыва: там всегда есть стрелка к логову (прыжок).
const SHAPES=[[1,0.55],[2,4],[3,2.5],[4,0.8]];
const edgeDist=(r,c)=>Math.min(r,c,N-1-r,N-1-c);
function reveal(r,c,mode,from){
  if(coopOn()){revealRoomAt(r,c,from);return;}
  if(!walkable(r,c))return;
  const x=cell(r,c);
  if(x.rev)return;
  x.rev=true;
  if(!onEdge(r,c)&&RNG()<(S.evP??0.33)&&(S.evW||EVENTS).length){x.ev=pickW(S.evW||EVENTS);if(x.ev==='monster'&&SEE())x.mon=pickMon(r,c);}
  if(x.stairs){x.ev=null;x.mon=null;}
  const all=Object.keys(D).filter(k=>walkable(r+D[k][0],c+D[k][1]));
  const jump=jumpDir(r,c);
  const open=k=>{const t=cell(r+D[k][0],c+D[k][1]);return !t.rev||t.arrows.includes(OPP[k]);};
  const ok=all.filter(open);
  const back=mode==='back';
  const good=ok.filter(k=>{const nr=r+D[k][0],nc=c+D[k][1];
    return back?edgeDist(nr,nc)<edgeDist(r,c)||(edgeDist(nr,nc)===edgeDist(r,c)&&dist(nr,nc)>dist(r,c)):dist(nr,nc)<dist(r,c);});
  let n=pickW(SHAPES);
  if(!from&&n<2)n=2;                         // плитки, открытые не шагом (карта, старт), тупиками не бывают
  if(onEdge(r,c)||ring(r,c)<=4)n=Math.max(n,2);
  const ex=new Set();
  if(from&&walkable(r+D[from][0],c+D[from][1]))ex.add(from);   // обратная стрелка
  if(jump)ex.add(jump);                                          // прыжок через пропасть
  if(ex.size<n&&good.length&&RNG()<0.85){const g=good.filter(k=>!ex.has(k));if(g.length)ex.add(g[rnd(g.length)]);}
  for(const k of shuffle(ok)){if(ex.size>=n)break;ex.add(k);}
  for(const k of shuffle(all)){if(ex.size>=Math.min(n,2))break;ex.add(k);}
  x.arrows=['U','R','D','L'].filter(k=>ex.has(k));
}
// 3D-версия: встав на клетку, герой видит, что за её выходами — соседние плитки открываются сразу
// (с выходом назад), и на них заранее видно монстров и вещи
function revealAhead(r,c,mode){if(!(S&&S.rules==='trophy'))return;const x=cell(r,c);if(!x.rev)return;
  for(const d of x.arrows){const nr=r+D[d][0],nc=c+D[d][1];if(walkable(nr,nc)&&!cell(nr,nc).rev)reveal(nr,nc,mode,OPP[d]);}}
function dirTo(p,r,c){for(const k in D)if(p.r+D[k][0]===r&&p.c+D[k][1]===c)return k;return null;}
function newLeg(p){p.stack=[];p.seen=new Map();}
// Ходы: в любой выход текущей плитки. Неизведанная плитка открывается с выходом назад;
// в уже открытую можно войти, только если у неё есть выход в нашу сторону.
// С края обрыва (по пути к логову) — прыжок через пропасть: {jump:true}, цель — клетка пропасти.
// Если все выходы упираются в стены — запасной ход: кратчайший путь к ближайшей неизведанной клетке.
// «Спуск»: из возможных шагов остаются те, на которые хватает очков действий (шаг, атака, переход в соседний зал)
function options(p){const o=optionsBase(p);return coopOn()&&p.ap?o.filter(x=>descCost(p,x)!=null):o;}
function optionsBase(p){
  if(p.mode!=='out'&&p.mode!=='back')return[];
  const x=cell(p.r,p.c);
  const prev=p.stack.length?p.stack[p.stack.length-1]:null;
  const opts=[];
  // зелье призрачного шага: весь ход — в любую соседнюю клетку сквозь стены
  if(p.ghost){
    for(const d of ['U','R','D','L']){const r=p.r+D[d][0],c=p.c+D[d][1];
      if(!inB(r,c))continue;
      if(inChasm(r,c)){if(p.mode==='out'&&jumpDir(p.r,p.c)===d)opts.push({d,r,c,jump:true});continue;}
      if(!walkable(r,c))continue;
      opts.push({d,r,c,ghost:true,back:!!prev&&prev[0]===r&&prev[1]===c});}
    if(COOP())for(let i=opts.length-1;i>=0;i--)if(opts[i].jump)opts.splice(i,1);
    if(opts.length)return opts;
  }
  for(const d of (x.rev?x.arrows:[])){
    const r=p.r+D[d][0],c=p.c+D[d][1];
    if(!inB(r,c))continue;
    if(inChasm(r,c)){if(p.mode==='out'&&jumpDir(p.r,p.c)===d)opts.push({d,r,c,jump:true});continue;}
    if(inRoom(r,c))continue;
    const t=cell(r,c);if(t.rev&&!t.arrows.includes(OPP[d]))continue;
    opts.push({d,r,c,back:!!prev&&prev[0]===r&&prev[1]===c});
  }
  if(coopOn()&&x.rev)for(const [d1,d2] of [['U','L'],['U','R'],['D','L'],['D','R']]){
    if(!x.arrows.includes(d1)||!x.arrows.includes(d2))continue;
    const r=p.r+D[d1][0]+D[d2][0],c=p.c+D[d1][1]+D[d2][1];if(!inB(r,c))continue;
    const a=cell(p.r+D[d1][0],p.c+D[d1][1]),b=cell(p.r+D[d2][0],p.c+D[d2][1]),t=cell(r,c);
    if(!t.rev||t.block||!a.arrows.includes(d2)||!b.arrows.includes(d1))continue;
    opts.push({d:d1+d2,r,c,diag:true,back:!!prev&&prev[0]===r&&prev[1]===c});
  }
  if(COOP())for(let i=opts.length-1;i>=0;i--)if(opts[i].jump)opts.splice(i,1);
  const pocket=!opts.length||closedPocket(p);
  const res=pocket?wander(p):opts;
  // кирка: из тупика (дальше только назад) можно пробить стену в соседнюю клетку;
  // из замкнутого кармана и так ведёт запасной путь сквозь завалы — там кирка не нужна
  if(p.pick&&!pocket&&!opts.some(o=>!o.back))return opts.concat(pickOpts(p,opts));
  return res;
}
function pickOpts(p,have){
  if(coopOn())return [];
  const out=[];
  for(const d of ['U','R','D','L']){const r=p.r+D[d][0],c=p.c+D[d][1];
    if(!walkable(r,c)||have.some(o=>o.r===r&&o.c===c))continue;out.push({d,r,c,pick:true});}
  return out;
}
// Замкнутый карман: по связанным выходам не дойти ни до неизведанной клетки, ни до цели
function closedPocket(p){
  if(coopOn())return false;
  const seen=new Set([K(p.r,p.c)]),q=[[p.r,p.c]];
  for(let i=0;i<q.length;i++){
    const [r,c]=q[i];const x=cell(r,c);
    if(p.mode==='back'&&onEdge(r,c)&&!(r===p.r&&c===p.c))return false;
    if(!x.rev)return false;
    if(p.mode==='out'&&jumpDir(r,c))return false;
    for(const d of x.arrows){const nr=r+D[d][0],nc=c+D[d][1];
      if(!walkable(nr,nc))continue;
      const t=cell(nr,nc);if(!t.rev)return false;
      if(!t.arrows.includes(OPP[d]))continue;
      const k=K(nr,nc);if(!seen.has(k)){seen.add(k);q.push([nr,nc]);}}
  }
  return true;
}
function wander(p){
  const adj=Object.keys(D).map(d=>({d,r:p.r+D[d][0],c:p.c+D[d][1]}));
  const goal=(r,c)=>!cell(r,c).rev||(p.mode==='out'&&!!jumpDir(r,c));
  const first=new Map(),depth=new Map(),q=[];
  adj.forEach(o=>{if(walkable(o.r,o.c)){first.set(K(o.r,o.c),new Set([o.d]));depth.set(K(o.r,o.c),0);q.push([o.r,o.c,0]);}});
  let best=Infinity;const win=new Set();
  for(let i=0;i<q.length;i++){
    const [r,c,dd]=q[i];if(dd>best)break;
    if(goal(r,c)){best=dd;first.get(K(r,c)).forEach(d=>win.add(d));continue;}
    for(const k in D){const nr=r+D[k][0],nc=c+D[k][1];if(!walkable(nr,nc)||(nr===p.r&&nc===p.c))continue;
      const key=K(nr,nc);
      if(!first.has(key)){first.set(key,new Set(first.get(K(r,c))));depth.set(key,dd+1);q.push([nr,nc,dd+1]);}
      else if(depth.get(key)===dd+1)first.get(K(r,c)).forEach(d=>first.get(key).add(d));}
  }
  const list=win.size?adj.filter(o=>win.has(o.d)):adj.filter(o=>walkable(o.r,o.c));
  return list.map(o=>({...o,lost:true}));
}
function stepTo(p,o){
  p.stack.push([p.r,p.c]);if(p.stack.length>40)p.stack.shift();
  p.r=o.r;p.c=o.c;
  const k=K(p.r,p.c);p.seen.set(k,(p.seen.get(k)||0)+1);
}
// ===== LOGIC-END =====

const KEY={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const GLYPH={cloak:'❖',scroll:'§',rope:'➰',gold:'$',chest:'◆',potion:'✚',haste:'»',amulet:'☘',sword:'†',map:'◎',bomb:'✹',monster:'☠',trap:'⚠',key:'⚷',door:'⌂',rat:'⚄',kobold:'☠',cultist:'☠',whelp:'☠',shield:'⛨',pick:'⚒',silver:'†',demon:'ψ',stone:'◈',merchP:'⚖',merchW:'⚖',cache:'$',ghost:'≋',mantle:'♨'};
const BAD={monster:1,trap:1,kobold:1,cultist:1,whelp:1};
const MONSTERS=[
  {n:'Гигантская крыса',img:'img/mon-rat.jpg',dc:9,dmg:1,loot:[10,20],d:'Облезлая крыса размером с собаку.'},

  {n:'Огненный вождь',img:'img/mon-firechief.jpg',dc:16,dmg:1,burn:3,loot:[45,70],how:'ткнул в тебя пылающим факелом',win:'Факел вождя шипит и гаснет, а маска-череп с треском раскалывается надвое.',d:'Из дыма выступает рогатый вождь в маске из черепа. Перья на его плечах тлеют, на поясе гремят костяные трофеи, а факел в руке ревёт, как живой. Он не кричит — он поджигает. Проиграешь — огонь перекинется на тебя.'},
  // 15 — Пустотное тело: чем ближе к пропасти вокруг логова, тем чаще встречается (voidChance); проигравшего телепортирует на клетку в радиусе 3
  {n:'Пустотное тело',img:'img/mon-void.jpg',dc:10,dmg:1,voidTp:3,loot:[15,30],how:'втянуло тебя в свою пустоту',win:'Чёрная дыра в груди твари схлопывается с тихим хлопком, и парящие камни градом осыпаются на пол.',d:'Под капюшоном нет лица — только темнота. В груди зияет чёрная дыра, вокруг неё кружат вырванные из пола камни, по краям мерцает лиловый свет. Эти твари выползают из бездны у логова дракона. Проиграешь — пустота проглотит тебя и выплюнет где-то рядом.'},

// Пустотное тело приходит из бездны: шанс, что монстр на клетке окажется им, растёт к пропасти вокруг логова.
// Кольцо 3 (у самой пропасти) — 90%, внешний край подземелья — 0%, между ними — линейно по кольцу (ring = расстояние Чебышёва до центра).
const MON_VOID=15,VOID_MAX=0.9;
function voidChance(r,c){
  if(r==null||coopOn())return 0;            // в «Спуске» пропасти нет — нет и пустотных тел
  const k=ring(r,c);if(k<3)return 0;
  return VOID_MAX*Math.max(0,Math.min(1,(C-k)/Math.max(1,C-3)));
}
// случайный монстр для клетки (r,c): сначала — шанс пустотного тела, иначе обычный равный выбор из остальных.
// Вся случайность через RNG() — в сетевой партии выбор одинаков у всех.
// «Спуск»: на 1–2 этажах среди рядовых монстров нет пещерного тролля (огра) и минотавра — огр там босс 1-го этажа;
// с 3-го этажа оба приходят как обычные монстры. В остальных режимах набор монстров прежний.
const MON_OGRE=10,MON_MINO=13;

  if(COOP()&&(S.depth||1)<3){const ok=MONSTERS.map((m,i)=>i).filter(i=>i!==MON_VOID&&i!==MON_OGRE&&i!==MON_MINO);return ok[rnd(ok.length)];}
  const i=rnd(MONSTERS.length-1);return i>=MON_VOID?i+1:i;
}

// ctx: 'menu' — из главного меню (в конце «Тренировочная партия»), 'game' — из меню партии
function tutorial(ctx){
  return new Promise(res=>{
    const el=$('tutor');let i=0,dir=1;
    const close=v=>{el.hidden=true;tutorOn=null;el.onpointerdown=el.onpointerup=null;res(v);};
    tutorOn=()=>close(null);
    const show=()=>{
      const s=TUT[i];
      $('tStep').textContent=`Шаг ${i+1} из ${TUT.length}`;$('tBar').style.width=(i+1)/TUT.length*100+'%';
      $('tSlide').className='tslide'+(dir<0?' back':'');void $('tSlide').offsetWidth;
      const hint={1:'Нажми на кубик',2:'Нажми на клетку в рамке',4:'Нажми на d20'}[i]||'';
      $('tSlide').innerHTML=`<div class="tvis">${s.v}</div><div class="tkick">${s.k}</div><h2 class="ttitle">${s.t}</h2><div class="ttext">${s.p}</div>${hint?`<div class="thint">${hint}</div>`:''}`;
      // последний урок: вместо «Дальше» — что делать после обучения
      $('tNav').hidden=!!s.end;$('tEnd').hidden=!s.end;
      $('tEnd').innerHTML=!s.end?'':ctx==='menu'?`<button type="button" class="primary" data-e="train">Тренировочная партия</button><div class="row"><button type="button" class="tprev" data-e="prev">← Назад</button><button type="button" data-e="menu">В главное меню</button></div>`
        :`<div class="row"><button type="button" class="tprev" data-e="prev">← Назад</button><button type="button" class="primary" data-e="menu">${ctx==='lessons'?'К урокам':'Вернуться к игре'}</button></div>`;
      $('tSlide').scrollTop=0;
      // для урока с плитками героя ставим после раскладки
      if(s.init)requestAnimationFrame(()=>s.init($('tSlide')));
      $('tPrev').style.visibility=i?'visible':'hidden';
      if(s.end){try{localStorage.setItem(TUT_KEY,'done');}catch(e){}}
      $('tEnd').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>b.dataset.e==='prev'?go(-1):close(b.dataset.e));
    };
    const go=d=>{const n=i+d;if(n<0||n>=TUT.length)return;dir=d;i=n;sfx('step');show();};
    $('tPrev').onclick=()=>go(-1);$('tNext').onclick=()=>go(1);
    $('tSkip').onclick=()=>close(null);
    // перелистывание свайпом
    let sx=null,sy=0;
    el.onpointerdown=e=>{if(e.target.closest('.tgrid,.rp-die,.die,button'))return;sx=e.clientX;sy=e.clientY;};
    el.onpointerup=e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)go(dx<0?1:-1);};
    el.hidden=false;show();
  });
}

   подсказками по ходу и экраном «Урок пройден». Прогресс — на устройстве; открыты все уроки сразу. */
const LES_KEY='dragon-lessons';
let lessonJump=false;   // после урока «К урокам» — сразу на экран уроков, минуя главное меню
const lesLoad=()=>{try{const v=JSON.parse(localStorage.getItem(LES_KEY)||'null');if(v&&typeof v==='object'&&v.done)return v;}catch(e){}return{done:{}};};
const lesSave=v=>{try{localStorage.setItem(LES_KEY,JSON.stringify(v));}catch(e){}};
const lesDoneN=()=>{const v=lesLoad();return LESSONS.filter(l=>v.done[l.id]).length;};
const revN=()=>{let n=0;for(const row of S.cells)for(const x of row)if(x.rev)n++;return n;};
const LES_ITEMS=['potion','haste','amulet','sword','scroll','map','shield','rope','bomb'];
const lesItems=()=>LES_ITEMS.reduce((t,k)=>t+((S.evN||{})[k]||0),0);
const lesOpened=()=>Math.max(0,revN()-(S.les0||0));
const toLair=p=>p.mode==='out'?'иди к логову в центре':p.mode==='room'?'выбирайся из логова':`до края ${edgeDist(p.r,p.c)} ${plural(edgeDist(p.r,p.c),'клетка','клетки','клеток')}`;
const LESSONS=[
  {id:'L1',lesson:1,t:'Первые шаги',img:'img/story-corridor.jpg',goal:'Открой 6 новых плиток',learn:'Кубик d4 и ходьба по плиткам',
    story:'Учебное подземелье: ни монстров, ни ловушек — только тёмные коридоры. Освойся с кубиком и ходьбой.',
    steps:['Нажми на кубик <b>d4</b> — выпадет число шагов.','Нажимай на клетки в <b>золотой рамке</b> — герой идёт туда.','Каждая новая плитка открывает выходы-стрелки.'],
    evP:0,ev:[],setup:()=>{S.les0=revN();},
    check:()=>lesOpened()>=6?{win:true}:null,
    stars:[{t:'Открой 6 новых плиток',prog:()=>`открыто ${Math.min(6,lesOpened())} из 6`}],
    chip:()=>` · плиток ${Math.min(6,lesOpened())}/6`,
    hints:[['l1roll','Твой ход начинается с броска. Нажми на <b>кубик d4</b> — выпавшее число покажет, сколько шагов сделает герой.',(p,ph)=>ph==='roll','roll'],
      ['l1move','Клетки в <b>золотой рамке</b> — куда можно шагнуть. Нажми на одну — герой пойдёт. Шагов столько, сколько выпало на d4.',(p,ph)=>ph==='move'],
      ['l1arrows','Стрелки на плитке — её <b>выходы</b>. В открытую плитку можно войти, только если у неё есть выход в твою сторону. ↩ — шаг назад по своему следу.',(p,ph)=>ph==='move'&&lesOpened()>=2]],
    done:'Ты умеешь бросать d4 и ходить по плиткам. Дальше — находки!'},
  {id:'L2',lesson:2,t:'Золото и сундуки',img:'img/item-chest.jpg',goal:'Собери 80 золотых',learn:'Находки: кошели и сундуки',
    story:'В этих коридорах путники теряли кошели, а кто-то оставил сундуки. Монстров по-прежнему нет.',
    steps:['Находки прячутся в новых плитках — открывай их больше.','Кошель — 15–40 золотых, сундук — 50–90.','Золото копится в мешке: счётчик на карточке героя вверху.'],
    evP:.55,ev:[['gold',3],['chest',2]],
    check:p=>p.gold>=80?{win:true}:null,
    stars:[{t:'Собери 80 золотых',prog:(S,p)=>`в мешке ${p.gold} из 80`}],
    chip:(S,p)=>` · ${p.gold}/80 зол.`,
    hints:[['l2find','Находки прячутся в <b>новых плитках</b>. Открывай больше плиток — чаще попадутся кошели и сундуки.',(p,ph)=>ph==='roll','roll'],
      ['l2bag','Золото в мешке! Сколько его — видно на <b>карточке героя</b> вверху (она подсвечена). Нажми на карточку — камера покажет героя на поле.',p=>p.gold>0]],
    done:'Золото найдено. В настоящей игре побеждает тот, кто вынесет из подземелья больше всех.'},
  {id:'L3',lesson:3,t:'Ловушка',img:'img/trap-spikes.jpg',goal:'Пройди через ловушку',learn:'Ловушки и проверка d20',
    story:'Плиты в этом коридоре подозрительно шатаются. Где-то спрятана ловушка — найди её и останься в живых.',
    steps:['Наступил на ловушку — бросай <b>d20</b>.','Выпало не меньше сложности — увернулся.','Провал — потеряешь ♥ (или пропустишь ход).'],
    evP:.5,ev:[['trap',4],['gold',1]],trap:1,
    check:p=>(S.evN||{}).trap&&alive(p)?{win:true}:null,
    stars:[{t:'Пройди через ловушку',prog:()=>'ищи ловушку в новых плитках'}],
    hints:[['l3look','Ловушки прячутся в <b>новых плитках</b>. Ищи — и будь готов бросить d20.',(p,ph)=>ph==='roll','roll']],
    done:'Ловушка позади. Проверка d20: выпало не меньше сложности — успех. Амулет удачи ☘ прибавляет +3.'},
  {id:'L4',lesson:4,t:'Первый бой',img:'img/mon-rat.jpg',goal:'Победи монстра',learn:'Бой с монстром, меч и сердца',
    story:'В коридорах шуршит гигантская крыса. У тебя старый меч и зелье — самое время для первого боя.',
    steps:['Монстр прячется в новой плитке.','Бой — бросок <b>d20</b> против сложности монстра. Меч † даёт +2.','Победа — трофей-золото. Поражение — −1 ♥, но можно искать снова.'],
    evP:.5,ev:[['monster',4],['gold',1]],mon:0,setup:p=>{p.sword=true;p.potions=1;},
    check:()=>S.kills>0?{win:true}:null,
    stars:[{t:'Победи монстра',prog:()=>'ищи монстра в новых плитках'}],
    hints:[['l4look','Где-то бродит <b>гигантская крыса</b>. Бой — бросок d20 против её сложности, старый меч † прибавит +2.',(p,ph)=>ph==='roll','roll'],
      ['l4hurt','Крыса ранила героя: −1 ♥. Сердца — на карточке вверху. Зелёная кнопка <b>✚</b> внизу вылечит. Ищи крысу снова!',p=>p.hp<maxHP(p)]],
    done:'Первая победа! Чем ближе к логову, тем сильнее монстры. Сердца кончатся — герой выбывает вместе с золотом.'},
  {id:'L5',lesson:5,t:'Зелья и вещи',img:'img/item-potion.jpg',goal:'Вылечись зельем и найди 2 вещи',learn:'Зелья, предметы и инвентарь',
    story:'Ты ранен после прошлой вылазки, но в сумке есть зелье здоровья. А в коридорах разбросаны полезные вещи.',
    steps:['Нажми зелёную кнопку <b>✚</b> — зелье вернёт 1 ♥.','Найди 2 вещи: меч, амулет, зелья, свитки, карту…','Вещи — в шестиугольниках внизу, всё снаряжение — в инвентаре 🎒.'],
    evP:.55,ev:[['potion',1.6],['haste',1.2],['amulet',1.2],['sword',1.2],['scroll',1.4],['map',.8],['gold',1]],
    setup:p=>{p.hp=Math.max(1,maxHP(p)-1);p.potions=1;},
    check:()=>S.drank&&lesItems()>=2?{win:true}:null,
    stars:[{t:'Вылечись зельем и найди 2 вещи',prog:()=>`${S.drank?'зелье ✓':'выпей зелье ✚'} · вещей ${Math.min(2,lesItems())} из 2`}],
    chip:()=>` · ${S.drank?'✚ ✓':'✚ —'} · вещи ${Math.min(2,lesItems())}/2`,
    hints:[['l5potion','Герой ранен. Нажми зелёную кнопку <b>✚</b> внизу — зелье вернёт 1 ♥. Пить можно в свой ход, до броска или во время шагов.',p=>!S.drank&&p.potions>0],
      ['l5inv','Найденные вещи загораются в <b>шестиугольниках</b> внизу. Всё снаряжение — в инвентаре: нажми 🎒.',()=>lesItems()>=1]],
    done:'Ты знаешь, как лечиться и где лежат вещи. Свитки из сумки используют до броска или во время шагов.'},
  {id:'L6',lesson:6,t:'Логово дракона',img:'img/lair.jpg',goal:'Побывай в логове и выберись к краю',learn:'Логово, добыча и путь назад',
    story:'Пора к главной цели. В центре подземелья спит дракон на горе золота. Доберись до логова, возьми добычу и вернись к краю карты.',
    steps:['Логово — в центре. С верёвкой ➰ пропасть у логова не страшна.','В логове каждый поиск даёт золото, но риск разбудить дракона растёт.','С добычей дойди до <b>любой клетки на краю</b> — это выход.'],
    evP:.25,ev:[['gold',2],['potion',1.5],['amulet',1]],setup:p=>{p.rope=true;p.ropeWorn=false;},
    check:p=>p.mode==='home'?{win:true}:null,
    stars:[{t:'Побывай в логове и выберись к краю',prog:(S,p)=>toLair(p)}],
    hints:[['l6go','Логово — в <b>центре</b> карты. Иди к нему: шаги к центру открывают плитки с выходами в нужную сторону.',(p,ph)=>ph==='roll','roll'],
      ['l6back','Добыча в мешке! Теперь дойди до <b>любой клетки на краю</b> подземелья — там выход.',p=>p.mode==='back']],
    done:'Ты побывал в логове и вынес добычу. Помни: чем дольше ищешь в логове, тем вероятнее дракон проснётся.'},
  {id:'L7',lesson:7,t:'Настоящая партия',img:'img/dragon-sleep.jpg',goal:'Выберись живым с добычей',learn:'Короткая партия против компьютера',
    story:'Экзамен. Всё по-настоящему: соперник-компьютер, монстры, ловушки, находки и шкала сна дракона. Добудь золото и выберись живым.',
    steps:['Шкала вверху — сон дракона: на 100% он проснётся.','Проснувшийся дракон выпускает пламя — беги к краю.','Цель — выбраться живым с золотом.'],
    rules:'wake',cpu:1,
    check:p=>p.mode==='home'?(p.gold>0?{win:true}:{win:false,why:'Ты выбрался, но без золота.'}):null,
    stars:[{t:'Выберись живым с добычей',prog:(S,p)=>toLair(p)}],
    hints:[['l7start','Теперь всё по-настоящему: соперник-компьютер, монстры и ловушки. Шкала вверху — <b>сон дракона</b>. Не мешкай!',(p,ph)=>ph==='roll','roll']],
    done:'Обучение пройдено! Ты готов к Приключению, Спуску и Арене дракона.'},
];
/* Подсветка в уроках: элемент управления, о котором говорит подсказка, пульсирует жёлтым (как кубик-напоминание).
   Снимается, когда элементом воспользовались (нажатие или условие until), при новой подсказке и в конце урока.
   cells — клетки поля, которые подсвечиваются жёлтыми кольцами (3D) или рамкой (2D). Вне уроков не работает. */
let LHL=null;
function lesHlClear(){if(!LHL)return;LHL.els.forEach(e=>{e.classList.remove('lhl');e.removeEventListener('click',lesHlClear,true);});LHL=null;boardDirty=true;}
function lesHlSet(key,hl){
  lesHlClear();
  if(!hl||!S||!S.mission)return;
  const els=[];(hl.sel||[]).forEach(q=>document.querySelectorAll(q).forEach(e=>{e.classList.add('lhl');e.addEventListener('click',lesHlClear,true);els.push(e);}));
  LHL={key,els,cells:hl.cells||null,until:hl.until||null,t0:S.turnNo,mission:S.mission};boardDirty=true;
}
function lesHlTick(){if(LHL&&(!S||S.over||S.mission!==LHL.mission||(LHL.until&&LHL.until(LHL))))lesHlClear();}
const lesMyMove=()=>S&&!S.over&&S.phase==='move'&&!busy&&P()===S.players[0]&&$('modal').hidden;
const lesOpt=f=>()=>lesMyMove()?options(P()).filter(f||(()=>true)).map(o=>[o.r,o.c]):[];
const lesBest=k=>()=>{if(!lesMyMove())return[];const o=options(P());if(!o.length)return[];const m=Math.min(...o.map(k));return o.filter(z=>k(z)===m).map(z=>[z.r,z.c]);};
window.lessonCells=()=>{if(!LHL||!LHL.cells||!S||S.over)return[];try{return LHL.cells()||[];}catch(e){return[];}};
const nextTurnOf=n=>L=>S.turnNo>L.t0+(n||0);
const LES_HL={
  L1:{l1roll:{sel:['#movedie'],until:()=>S.phase!=='roll'||rolling},
      l1move:{cells:lesOpt(o=>!o.back),until:nextTurnOf(0)},
      l1arrows:{cells:lesOpt(),until:nextTurnOf(0)}},
  L2:{l2find:{cells:lesOpt(o=>!cell(o.r,o.c).rev),until:nextTurnOf(1)},
      l2bag:{sel:['#pill0'],until:nextTurnOf(1)}},
  L3:{l3look:{cells:lesOpt(o=>!cell(o.r,o.c).rev),until:()=>(S.evN||{}).trap>0}},
  L4:{l4look:{cells:lesOpt(o=>!cell(o.r,o.c).rev),until:()=>(S.evN||{}).monster>0},
      l4hurt:{sel:['#bPotion'],until:()=>S.drank>0||P().hp>=maxHP(P())}},
  L5:{l5potion:{sel:['#bPotion'],until:()=>S.drank>0},
      l5inv:{sel:['#bScroll','.hexes .hex:not(.empty):not([hidden])'],until:()=>!$('charsheet').hidden}},
  L6:{l6go:{cells:lesBest(z=>dist(z.r,z.c)),until:()=>S.players[0].mode!=='out'},
      l6back:{cells:lesBest(z=>edgeDist(z.r,z.c)),until:()=>S.players[0].mode==='home'}},
  L7:{l7start:{sel:['#movedie','#wake'],until:nextTurnOf(0)}},
};
LESSONS.forEach(l=>{l.hl=LES_HL[l.id]||null;});
const lessonById=id=>LESSONS.find(l=>l.id===id);
const lesDots=st=>`<div class="lesdots">${LESSONS.map((l,i)=>`<i class="${st.done[l.id]?'ok':''}">${st.done[l.id]?'✓':i+1}</i>`).join('')}</div>`;
// экран уроков: список с отметками, рекомендованный следующий подсвечен; все уроки открыты
async function lessonMenu(){
  for(;;){
    const st=lesLoad(),next=LESSONS.findIndex(l=>!st.done[l.id]),n=lesDoneN();
    const list=LESSONS.map((l,i)=>{const d=!!st.done[l.id];
      return`<button type="button" class="cm les ${d?'done':''} ${i===next?'next':''}" data-id="${l.id}"><div class="no">${d?'✓':i+1}</div><span><b>${l.t}</b><small>${l.learn}</small></span><div class="st">${d?'<em class="ok">пройден</em>':i===next?'<em>дальше</em>':''}</div></button>`;}).join('');
    const pick=await modal({local:true,icon:'✦',tone:'gold',title:'Обучение',sub:'Уроки от простого к сложному',
      html:`<div class="camp">${list}</div><div class="camptot">Пройдено уроков: <b>${n}</b> из ${LESSONS.length}${n===LESSONS.length?' · ты готов к подземелью!':''}</div>`,
      buttons:[{label:'Правила в картинках',value:'slides'},{label:'← В главное меню',cls:'mback',value:null}],noFocus:true,
      onOpen:done=>{$('mtext').querySelectorAll('.cm.les').forEach(b=>b.onclick=()=>done(b.dataset.id));}});
    if(pick==='slides'){await tutorial('lessons');continue;}
    if(!pick)return null;
    if(await lessonBrief(pick))return pick;
  }
}
function lessonBrief(id){
  const L=lessonById(id),i=LESSONS.indexOf(L);
  return modal({local:true,icon:String(i+1),tone:'gold',img:L.img,title:L.t,sub:`Урок ${i+1} из ${LESSONS.length} · ${L.learn}`,
    html:`<div class="brief"><p>${L.story}</p><div class="goal">◎ Задача: <b>${L.goal}</b></div><ol class="lsteps">${L.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`,
    buttons:[{label:'Начать урок',cls:'primary',value:true},{label:'← К урокам',cls:'mback',value:false}]});
}
function startLesson(id){
  const L=lessonById(id);if(!L){newGame();return;}
  const h=heroCfg(),cp=h.portrait===6?1:6;
  const pl=[{seat:0,name:h.name,portrait:h.portrait}];
  if(L.cpu)pl.push({seat:2,name:cpuNames([cp])[0],cpu:true,portrait:cp});
  startGame(pl,'small',{rules:L.rules||'free'});
  Object.assign(S,{mission:id,evW:L.ev||null,evP:L.evP,evN:{},kills:0,drank:0,lseen:[],kCaught:false,kLost:false,hurt:false,mst:null,
    lesMon:L.mon??null,lesTrap:L.trap??null});
  if(L.setup)L.setup(S.players[0]);
  lesHlClear();
  addLog(`Урок ${L.lesson} «${L.t}»: ${L.goal.toLowerCase()}.`);
  toast(`Урок ${L.lesson}: ${L.goal}`,3500);
  boardFull=true;render();
}
async function lessonEnd(r,L){
  const p=S.players[0],i=LESSONS.indexOf(L),nx=LESSONS[i+1];
  S.over=true;S.phase='over';busy=false;$('rollpop').hidden=true;stopHeart();clearSave();coachHide();lesHlClear();
  render();
  let v;
  if(r.win){
    const st=lesLoad();st.done[L.id]=1;lesSave(st);try{localStorage.setItem(TUT_KEY,'done');}catch(e){}
    sfx('escape');addLog(`Урок «${L.t}» пройден.`);
    v=await modal({local:true,icon:'✓',tone:'good',img:L.img,title:'Урок пройден!',sub:`Урок ${i+1} из ${LESSONS.length} · ${L.t}`,
      html:`<div class="brief"><p>${L.done}</p></div>${lesDots(st)}`,
      buttons:[...(nx?[{label:'Следующий урок',cls:'primary',value:'next'}]:[]),{label:'К урокам',value:'list'},{label:'В меню',value:'menu',cls:nx?'':'primary'}]});
  }else{
    sfx('allLose');
    v=await modal({local:true,icon:'↻',tone:'fire',img:L.img,title:'Урок не пройден',sub:`Урок ${i+1} · ${L.t}`,
      text:`${r.why}\n\nНичего страшного — подземелье каждый раз новое. Попробуй ещё раз.`,
      buttons:[{label:'Ещё раз',cls:'primary',value:'again'},{label:'К урокам',value:'list'},{label:'В меню',value:'menu'}]});
  }
  if(v==='next'&&nx){if(await lessonBrief(nx.id)){startLesson(nx.id);return;}v='list';}
  if(v==='again'){startLesson(L.id);return;}
  if(v==='list')lessonJump=true;
  newGame();
}
/* ---------- приключение: Акт I «Тайный вход» ----------
   Миссия — обычная партия с особой подготовкой, своей целью и тремя звёздами.
   Первая звезда — за прохождение, ещё две — за дополнительные условия. Прогресс хранится на устройстве. */
const CAMP_KEY='dragon-camp';
let campJump=false;   // после миссии «К миссиям» — сразу на экран акта, минуя главное меню
const campLoad=()=>{try{const v=JSON.parse(localStorage.getItem(CAMP_KEY)||'null');if(v&&typeof v==='object'&&v.stars)return v;}catch(e){}return{stars:{},seen:false,intro:false,actDone:false};};
const campSave=v=>{try{localStorage.setItem(CAMP_KEY,JSON.stringify(v));}catch(e){}};
const campStars=()=>{const v=campLoad();return CAMP_ACT.reduce((t,m)=>t+(v.stars[m.id]||0),0);};
const evOnly=(keep,over={})=>EVENTS.filter(([k])=>keep.includes(k)).map(([k,w])=>[k,over[k]??w]);
const evWithout=(drop,over={})=>EVENTS.filter(([k])=>!drop.includes(k)).map(([k,w])=>[k,over[k]??w]);
// состояние звезды во время миссии: ok — выполнено или пока держится, fail — упущена, wait — ещё не набрано
function starState(x,p){
  if(x.turns){const v=`ход ${Math.max(1,S.turnNo)} из ${x.turns}`;return S.turnNo<=x.turns?{s:'ok',v,keep:1}:{s:'fail',v};}
  if(x.hp)return S.hurt?{s:'fail',v:'герой ранен'}:{s:'ok',v:'сердца целы',keep:1};
  if(x.gold)return{s:p.gold>=x.gold?'ok':'wait',v:`${p.gold} из ${x.gold}`};

  if(!(tipsOn||lesH)||coachCur||S.over||!p||!isLocal(p)||!alive(p)||introOn||!$('modal').hidden||!$('tutor').hidden)return;

/* ---------- облёт камеры в начале партии ----------
   Всё поле сверху (куда идти) → плавное приближение к логову дракона → перелёт к герою игрока.
   Анимация — CSS-трансформацией поля; в конце поле переходит в обычный масштаб ровно с того же вида.
   Нажатие на экран пропускает облёт. */
let introOn=false,introSkipAt=0;
function introCamera(){
  return new Promise(done=>{
    const st=stage,bx=box,finalZoom=zoom;
    const mine=S.online?S.players.find(q=>q.net===NET.id):null;
    const hero=mine||S.players.find(q=>!q.cpu)||S.players[0];
    introOn=true;zoom=false;size();
    const s1=W/N,bw=bx.clientWidth,bh=bx.clientHeight;
    const pad=parseFloat(getComputedStyle(bx).paddingLeft)||0,offX=st.offsetLeft,offY=st.offsetTop;
    // вид в конце: как после обычного масштаба и follow() на героя
    let kEnd=1,txEnd=0,tyEnd=0;
    if(finalZoom){
      const fit=Math.floor(Math.min(bw,bh)/N)*N,zc=Math.max(28,Math.floor(Math.min(bw,bh)/21)*3),W2=Math.max(fit,Math.round(zc*N*(finalZoom===2?1.5:1))),s2=W2/N;
      kEnd=s2/s1;
      const axis=(cpos,client,off)=>{const inner=client-2*pad;
        const o2=pad+Math.max(0,(inner-W2)/2),max=Math.max(0,W2+2*pad-client);
        const sl=Math.min(max,Math.max(0,cpos*s2+s2/2-client/2));return{t:o2-sl-off,sl};};
      const ax=axis(hero.c,bw,offX),ay=axis(hero.r,bh,offY);txEnd=ax.t;tyEnd=ay.t;introCamera.sl=[ax.sl,ay.sl];
    }else{
      // поле и так целиком на экране — подсветим героя лёгким приближением и вернёмся
      kEnd=1;txEnd=0;tyEnd=0;
    }
    // вид на логово: в кадре около 7×7 клеток
    const kL=Math.min(4,Math.max(1.6,Math.min(bw,bh)/(7*s1))),lc=(C+0.5)*s1;
    const tL=[bw/2-offX-kL*lc,bh/2-offY-kL*lc];
    const KEY=[{t:0,k:1,x:0,y:0},{t:1300,k:1,x:0,y:0},{t:2900,k:kL,x:tL[0],y:tL[1]},{t:3800,k:kL,x:tL[0],y:tL[1]},{t:5300,k:kEnd,x:txEnd,y:tyEnd}];
    const T=KEY[KEY.length-1].t;
    const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
    const set=(k,x,y)=>{st.style.transform=`translate(${x}px,${y}px) scale(${k})`;};
    introOn=true;bx.style.overflow='hidden';st.style.transformOrigin='0 0';st.style.willChange='transform';
    $('who').innerHTML='<span class="whoname" id="whoName">Экспедиция начинается</span><span class="whohint" id="whoHint"></span>';$('who').style.setProperty('--pc',css('--gold'));
    // в «Спуске» логова нет — подсказка о его цели: найти лестницу вниз
    toast(COOP()?'Найдите лестницу вниз — встал на неё один, спускается весь отряд.':'Логово дракона — в центре подземелья. Набери золота и вернись живым!',3200);
    const t0=performance.now();let ended=false;
    const finish=()=>{if(ended)return;ended=true;introOn=false;introSkipAt=performance.now();
      document.removeEventListener('pointerdown',skip,true);
      st.style.transform='';st.style.willChange='';bx.style.overflow='';
      zoom=finalZoom;size();
      if(finalZoom&&introCamera.sl){bx.scrollLeft=introCamera.sl[0];bx.scrollTop=introCamera.sl[1];}
      done();};
    const skip=e=>{if(!$('modal').hidden)return;finish();};
    document.addEventListener('pointerdown',skip,true);
    const step=now=>{
      if(ended)return;
      const t=Math.min(T,now-t0);
      let i=0;while(i<KEY.length-2&&t>KEY[i+1].t)i++;
      const a=KEY[i],b=KEY[i+1],u=ease(Math.min(1,(t-a.t)/(b.t-a.t||1)));
      // масштаб — по логарифму, чтобы приближение шло равномерно
      const k=Math.exp(Math.log(a.k)+(Math.log(b.k)-Math.log(a.k))*u);
      // сдвиг пересчитываем через точку экрана, к которой летит камера, — без «рыскания»
      const ca=[(bw/2-offX-a.x)/a.k,(bh/2-offY-a.y)/a.k],cb=[(bw/2-offX-b.x)/b.k,(bh/2-offY-b.y)/b.k];
      const cx=ca[0]+(cb[0]-ca[0])*u,cy=ca[1]+(cb[1]-ca[1])*u;
      set(k,bw/2-offX-k*cx,bh/2-offY-k*cy);
      if(t>=T){finish();return;}
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* ---------- кто сейчас может действовать ---------- */
// isLocal — герой, которым управляют с этого телефона (не компьютер и не игрок с другого телефона)
const isLocal=q=>!!q&&!q.cpu&&(!S||!S.online||q.net===NET.id);
const lockedTurn=()=>!!(S&&!S.over&&S.players[S.cur]&&!isLocal(S.players[S.cur]));
// Действие игрока. В сетевой партии оно сначала уходит на сервер и выполняется на всех телефонах,
// когда сервер разошлёт его обратно — так у всех одинаковый порядок событий.
function act(a,d={}){
  if(!S||S.over)return;
  if(!S.online)return doAct(a,d);
  // отправлять только то, что можно сделать прямо сейчас: не во время анимации броска,
  // не дважды и не раньше, чем телефон догнал все ходы соперников
  if(!isLocal(P())||NET.sent||NET.queue.length)return;
  if(a==='tp'?!(S.phase==='tp'&&S.tp):(!netIdle()||!PHASE_OK[a]?.()))return;
  NET.sent=true;netInput({a,...d});
}
const PHASE_OK={roll:()=>S.phase==='roll',skip:()=>S.phase==='roll',hide:()=>S.phase==='roll',cloak:()=>S.phase==='roll',ghost:()=>S.phase==='roll',move:()=>S.phase==='move',exit:()=>S.phase==='exit',
  potion:()=>['roll','move','exit'].includes(S.phase),haste:()=>S.phase==='roll',bag:()=>['roll','move'].includes(S.phase),claim:()=>true,
  dact:()=>S.phase==='move'&&coopOn(),dend:()=>S.phase==='move'&&coopOn()};
function doAct(a,d){
  switch(a){
    case'roll':return rollD4();
    case'skip':return skipTurn();
    case'hide':return hideTurn();
    case'cloak':return useCloak();
    case'ghost':return useGhost();
    case'haste':return useHaste();
    case'move':{const o=options(P()).find(o=>o.r===d.r&&o.c===d.c&&!!o.jump===!!d.j);return o?move(o):undefined;}
    case'exit':return doExit(d.r,d.c);
    case'potion':return drinkAct();
    case'bag':return useScrollBag(d);
    case'claim':return claimVictory(P());
    case'dact':return descAction(d.k,d);
    case'dend':return descEndTurn();
    case'tp':if(S.phase==='tp'&&S.tp&&S.tp.spots.some(([r,c])=>r===d.r&&c===d.c))S.tp.res([d.r,d.c]);return;
  }
}

function netMsg(m){

/* ---------- чат по сети ----------

function chatCount(){const n=$('chatIn').value.length;$('chatCnt').textContent=n>150?`${n}/${CHAT_MAX}`:'';}
function chatSend(){

// Ждём, пока игра дойдёт до места, где нужно это действие. Порядок действий у всех одинаковый.
const netIdle=()=>!busy&&!rolling&&(!MODAL||MODAL.local);

// (лишний повторный клик, окно уже закрыто, ход уже прошёл). Устаревшее у всех одинаково пропускается,
// иначе одно такое действие навсегда остановило бы очередь.
function netReady(it){
  const d=it.d;
  if(d.a==='drop')return 'ready';
  if(S.over)return 'stale';
  if(d.a==='timeout'){
    if(d.turn>S.turnNo)return 'wait';
    if(d.turn<S.turnNo)return 'stale';
    const st=timerState();if(!st)return 'wait';           // игра в движении — дождаться, пока встанет
    const q=S.players[d.s];

  }
  if(d.a==='btn'){
    if(MODAL&&MODAL.sync&&MODAL.seq===d.m)return MODAL.stage===d.st?'ready':MODAL.stage>d.st?'stale':'wait';
    if(modalSeq>d.m)return 'stale';                       // это окно уже закрылось

  if(d.turn<S.turnNo)return 'stale';

function netApply(it){

let netPumping=false;
function netPump(){
  if(!S||!S.online||netPumping)return;

    const mine=S.players.findIndex(q=>q.net===NET.id);
    for(let k=0;k<4;k++){
      const it=NET.queue[0];if(!it)break;
      const st=netReady(it);
      if(st==='stale'){NET.queue.shift();console.warn('NET skip stale',JSON.stringify(it.d),{turn:S.turnNo,phase:S.phase});

        if(Date.now()-NET.stuck>20000&&!NET.stuckWarned){NET.stuckWarned=true;

// Последний живой игрок отключился → партия останавливается, все возвращаются в главное меню.
// Последний живой игрок погиб или выбрался → партия заканчивается, показываются итоги.
const humanAlive=q=>alive(q)&&(!q.cpu||q.afk)&&!NET.drops.includes(S.players.indexOf(q));
function netHumansCheck(){
  if(!S||!S.online||S.over)return;
  if(S.players.some(humanAlive))return;
  const leftNow=S.players.some(q=>alive(q)&&(q.dropped||NET.drops.includes(S.players.indexOf(q))));
  if(leftNow)netAbandon('Последний игрок отключился — партия остановлена.');

function netAbandon(msg){

// Игрок отключился: его героем начинает играть компьютер — ровно в тот момент, когда игра ждёт его хода.
function netDropCheck(){
  for(const seat of NET.drops.slice()){
    const q=S.players[seat],rm=()=>NET.drops.splice(NET.drops.indexOf(seat),1);
    if(!q){rm();continue;}
    if(q.cpu){rm();q.dropped=true;q.net=null;q.afk=false;addLog(`${q.name} отключился — дальше за него играет компьютер.`);render();continue;}
    const now=(MODAL&&MODAL.sync&&MODAL.owner===q)||(P()===q&&S.phase==='tp'&&S.tp)||(P()===q&&alive(q)&&netIdle()&&['roll','move','exit'].includes(S.phase));
    if(now){rm();addLog(`${q.name} отключился — дальше за него играет компьютер.`);takeOver(q,'drop');}
  }

// Героем начинает играть компьютер — ровно с того места, где игра ждёт его действия.
// kind: 'drop' — игрок отключился (до конца партии), 'afk' — вышло время хода (только до конца этого хода).
function takeOver(q,kind){
  if(kind==='drop'){q.dropped=true;q.net=null;}
  if(q.cpu){render();return;}
  q.cpu=true;if(kind==='afk')q.afk=true;
  render();
  if(MODAL&&MODAL.sync&&MODAL.owner===q){MODAL.auto(900);return;}
  if(P()!==q||!alive(q))return;
  if(S.phase==='tp'&&S.tp){const t=S.tp;setTimeout(()=>{if(S.tp===t)t.res(cpuTpPick(q,t.spots));},900);return;}
  if(S.phase==='exit'){const e=cpuExit(q),turn=S.turnNo;setTimeout(()=>{if(S.turnNo===turn&&S.phase==='exit'&&P()===q)doExit(e[0],e[1]);},900);return;}
  if(S.phase==='roll'||S.phase==='move'){if(S.phase==='roll')showRollPop(q);cpuTurn();}

/* ---------- таймер хода (игра по сети) ----------
   Игра стоит и ждёт игрока дольше заданного — его телефон (или, если он молчит, телефон соперника)
   присылает «время вышло». Сервер рассылает это всем в общем порядке, и на всех телефонах

// null — игра в движении; иначе кого ждём (who) и «отпечаток» места, где ждём (key)
function timerState(){
  const key=()=>[S.turnNo,modalSeq,MODAL&&MODAL.sync?MODAL.stage:0,S.phase,P().moves|0,P().ap?P().ap.atk+'.'+P().ap.act:''].join('|');
  if(MODAL&&MODAL.sync){if(MODAL.anim)return null;const o=MODAL.owner;return{who:o&&!o.cpu?o:null,key:key()};}
  if(busy||rolling)return null;

async function nextTurn(){

  S.players.forEach(q=>{if(q.afk){q.afk=false;if(!q.dropped)q.cpu=false;}});
  S.prev=S.cur;
  for(let i=0;i<n*3;i++){
    S.cur=(S.cur+1)%n;
    const p=P();
    if(!alive(p))continue;
    if(p.stun>0&&S.players.filter(alive).length>1){
      if(S.awake&&heroRing(p)<=S.fire){p.burnSkip=true;found=S.cur;break;}   // в огне пламя достанет и оцепеневшего
      p.stun--;addLog(`${p.name} пропускает ход.`);notes.push(`${p.name} пропускает ход — ещё не пришёл в себя.`);continue;}
    if(p.stun>0)p.stun=0;
    found=S.cur;break;
  }
  if(found<0){if(!S.players.some(alive))return finish();S.cur=S.players.findIndex(alive);}
  const newRound=S.prev<0||S.cur<=S.prev;
  if(newRound)advanceRound();   // очередь пошла на новый круг — новый раунд
  if(newRound&&COOP()&&S.prev>=0){await descPhases();if(S.over)return;if(!S.players.some(alive))return finish();if(!alive(P()))return nextTurn();}
  // все герои людей погибли, в подземелье бродят только компьютеры — доигрывать им незачем, партия окончена
  // (если кто-то из людей выбрался с золотом, компьютеры доигрывают: от них зависит, кто победит)
  if(S.players.filter(alive).length>=2&&S.players.some(q=>!q.cpu)&&!S.players.some(q=>!q.cpu&&(alive(q)||q.mode==='home')))return finish();

  const act=S.players.filter(alive);
  if(!COOP()&&S.players.length>1&&act.length===1&&!S.players.some(q=>q.mode==='home')&&!S.soloOffered){
    S.soloOffered=true;
    const w=act[0];S.cur=S.players.indexOf(w);
    if(w.cpu){claimVictory(w);return;}
    const v=await modal({icon:'♛',tone:'gold',img:'img/title.jpg',imgTall:true,title:'Ты остался один',sub:'Победа уже твоя',
      text:`Все остальные герои погибли. ${w.name}, ты побеждаешь — можно закончить прямо сейчас с ${w.gold} золотыми.\n\nИли доиграй: собери ещё золота и драгоценностей и выберись живым. Но если погибнешь, победа сгорит.`,
      buttons:[{label:`Забрать победу — ${w.gold} золотых`,cls:'primary',value:'claim'},{label:'Доиграть и собрать больше',value:'go'}]});
    if(v==='claim'){claimVictory(w);return;}

async function handoff(notes){

function hereMsg(p){

function crumble(p){

  p.trail.forEach(([r,c])=>{
    if(others.some(o=>(alive(o)&&o.r===r&&o.c===c)||(o.home[0]===r&&o.home[1]===c)))return;
    if(!cell(r,c).rev)return;

// Переход через бездонную пропасть: верёвка — без проверки; иначе d20 (+амулет) против 15 (шанс 30%).

function fallToOutskirts(p){

  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(edgeDist(r,c)===1&&walkable(r,c)&&!S.players.some(q=>q!==p&&alive(q)&&q.r===r&&q.c===c))spots.push([r,c]);
  const [r,c]=spots[rnd(spots.length)];
  const lost=crumble(p);   // пройденный путь рассыпается
  if(lost)addLog(`Путь, пройденный ${p.name}, рассыпался: ${lost} ${plural(lost,'плита','плиты','плит')}.`);
  reveal(r,c,'out');const x=cell(r,c);x.ev=null;x.visited=true;
  p.r=r;p.c=c;newLeg(p);p.trail=[[r,c]];boardFull=true;

function buzz(ms){try{if(window.Android&&Android.vibrate)Android.vibrate(Array.isArray(ms)?ms.reduce((x,y,i)=>i%2?x:x+y,0):ms);else if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
// штрафы к броскам d20: проклятие демона (−3) и рана после проигранной встречи (−3); итог броска не ниже 1
const curseB=p=>p?(p.curseTurn?-3:0)+(p.woundTurn?-3:0)+(p.bless>0?1:0):0;
const warded=p=>!!(p&&p.ward>0);

/* ---------- «Спуск»: кооператив по залам 4×4 ----------
   Поле 21×21 — сетка 7×7 залов. Зал огорожен стеной, как обычная клетка; выходы — в середине сторон (С/В/Ю/З).
   Зал открывается целиком, когда в него входят (или его показывает карта): до 2 монстров и вещь или ловушка,
   которая срабатывает на весь отряд — каждый проходит проверку по очереди. Лестница вниз — в центре одного из залов. */

const DITEMS=[['gold',3],['cache',1],['chest',1.6],['potion',2.4],['haste',1.1],['amulet',1],['sword',.9],['shield',.8],['scroll',1.4],['silver',.5],['stone',.35],['map',.5],['merchP',.5],['merchW',.4]];

const roomAt=(r,c)=>S.rooms&&S.rooms[rkey(Math.floor(r/RS),Math.floor(c/RS))];

// проход между залами — на 2-й или 3-й клетке стены; у общей стены соседних залов он один и тот же
function gateK(R,Cc,d){const id=d==='U'?(R-1)*7+Cc:d==='D'?R*7+Cc:d==='L'?100+R*7+Cc-1:100+R*7+Cc;return 1+((id*37+11)%5>1?1:0);}
function roomGate(R,Cc,d){const b0=R*RS,c0=Cc*RS,k=gateK(R,Cc,d);return d==='U'?[b0,c0+k]:d==='D'?[b0+RS-1,c0+k]:d==='L'?[b0+k,c0]:[b0+k,c0+RS-1];}
const RNn=()=>Math.floor(N/RS);

/* ---------- потайная дверь, медный ключ, хитрый крысюк ---------- */
async function secretDoor(p){
  const hasKey=(p.key||0)>0;
  const v=await modal({icon:'⌂',tone:'gold',img:'img/secret_door.jpg',title:'Потайная дверь',sub:'Тайник',
    text:`За плющом в стене — низкая окованная дверь с тяжёлым замком. Что за ней, неизвестно.\n\n${hasKey?'Твой медный ключ подходит к замку!':'Ключа у тебя нет. Вскрыть такой замок трудно: нужно 19 или больше на d20.'}`,
    buttons:[hasKey?{label:'Открыть медным ключом',cls:'primary',value:'key'}:{label:'Вскрыть замок · нужно 19 на d20',cls:'primary',value:'pick'},{label:'Пройти мимо',value:'no'}],
    cpuPick:()=>hasKey?'key':'pick'});
  let open=false;
  if(v==='key'){p.key--;open=true;sfx('door');addLog(`${p.name} открыл потайную дверь медным ключом.`);}
  else if(v==='pick'){
    const lb=p.luck>0?3:0,cb=curseB(p);
    await modal({icon:'⌂',tone:'gold',img:'img/secret_door.jpg',title:'Вскрыть замок',sub:'Потайная дверь',text:'Ржавый механизм упрямится. Нужны ловкие пальцы и немного везения.',
      roll:{dc:19,bonus:lb+cb,bonusText:[lb?'амулет':'',cb?penLabel(p):''].filter(Boolean).join(', '),forced:p.jinxTurn?1:0,outcome:(r,win)=>{
        if(p.luck>0)p.luck--;open=win;
        if(win)sfx('door');
        const t=win?'Щёлк! Замок поддался.':'Замок не поддался — дверь так и осталась закрытой.';
        addLog(`Потайная дверь (${p.name}): ${t}`);return t;}}});
  }else addLog(`${p.name} прошёл мимо потайной двери.`);
  if(open){if(v==='key')await wait(900);await secretRoom(p);}
}
async function secretRoom(p){

  if(x<36){p.gold+=150;sfx('chest');addLog(`${p.name} нашёл в тайнике самоцветы: +150 золотых.`);render();
    await show('◆','gold','img/item-gem.jpg','Самоцветы!','В тайнике стоит сундучок, полный самоцветов, — как в логове дракона: +150 золотых.');return;}

    const pool=['bomb','amulet','stone','key'];if(!p.rope)pool.push('rope');

    else if(k==='amulet'){p.luck=(p.luck||0)+3;sfx('amulet');img='img/item-amulet.jpg';t='Амулет удачи: +3 к трём следующим проверкам.';}
    else if(k==='rope'){p.rope=true;p.ropeWorn=false;sfx('success');img='img/item-rope.jpg';t='Верёвка с крюком: пропасть у логова — без проверки.';}
    else if(k==='key'){p.key=(p.key||0)+1;sfx('key');img='img/key.jpg';t='Ещё один медный ключ — к следующей потайной двери.';}
    else{p.scrolls=p.scrolls||[];p.scrolls.push('stone');sfx('stone');img='img/item-stone.jpg';t='Камень судьбы: пока он действует, на тебя нельзя наложить негативный эффект. Лежит в сумке свитков.';}
    addLog(`${p.name} нашёл в тайнике редкий предмет.`);render();
    await show('✦','good',img,'Редкая находка',t);return;}
  if(x<90){const id=randomScroll();p.scrolls=p.scrolls||[];p.scrolls.push(id);sfx('findScroll');addLog(`${p.name} нашёл в тайнике свиток «${SCROLLS[id].n}».`);render();

  sfx('monster');addLog(`${p.name}: в тайнике сидел монстр!`);

// бонус оружия в бою: серебряный клинок +5 против нежити, старый меч +2 (кроме тех, кого сталь не берёт)
function weaponB(p,m={}){
  let w=m.undead&&p.silver?{b:5,t:'серебряный клинок'}:p.sword&&!m.noSword?{b:2,t:'меч'}:{b:0,t:''};

  if(coopOn()&&p&&p.sword&&p.silver)w=wpnOf(p)==='silver'?(m.undead?{b:5,t:'серебряный клинок'}:{b:0,t:''}):(!m.noSword?{b:2,t:'меч'}:{b:0,t:''});
  if(p&&p.burnTurn){w.b-=3;w.t=w.t?w.t+', ожог −3':'ожог −3';}   // ожог Огненного вождя: −3 к d20 только в бою
  return w;
}
